<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#edf4f8">
  <meta name="description" content="宿舍换水记录工具：按次轮换、完成或跳过自动顺延、记录饮水天数并保存在本机。">
  <title>宿舍换水 · 按次轮换</title>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('dorm-water:v1');
        var saved = raw ? JSON.parse(raw) : null;
        var theme = saved && saved.settings && saved.settings.theme;
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#071019' : '#edf4f8');
      } catch (error) {}
    }());
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #edf4f8;
      --bg-glow: rgba(70, 168, 220, 0.20);
      --bg-glow-2: rgba(67, 190, 165, 0.10);
      --surface: #ffffff;
      --surface-2: #f5fafc;
      --surface-3: #eaf3f8;
      --line: rgba(20, 55, 75, 0.10);
      --line-strong: rgba(20, 55, 75, 0.17);
      --text: #152a35;
      --text-2: #44616f;
      --muted: #586f7c;
      --accent: #43a9df;
      --accent-strong: #086b9a;
      --accent-soft: rgba(67, 169, 223, 0.12);
      --accent-border: rgba(28, 133, 188, 0.24);
      --accent-grad-a: #7cceff;
      --accent-grad-b: #43a9df;
      --accent-contrast: #052331;
      --success: #157347;
      --success-soft: rgba(21, 115, 71, 0.10);
      --success-border: rgba(21, 115, 71, 0.20);
      --danger: #b83232;
      --danger-soft: rgba(184, 50, 50, 0.09);
      --danger-border: rgba(184, 50, 50, 0.20);
      --shadow: 0 1.5rem 3rem -2.2rem rgba(15, 52, 70, 0.35);
      --toast-bg: #12232d;
      --toast-text: #f4fbff;
      --focus: rgba(67, 169, 223, 0.28);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #071019;
      --bg-glow: rgba(48, 150, 205, 0.14);
      --bg-glow-2: rgba(54, 170, 148, 0.08);
      --surface: #0f1c28;
      --surface-2: #122433;
      --surface-3: #162a3a;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.14);
      --text: #e9f4fa;
      --text-2: #b2c7d3;
      --muted: #8aa1ae;
      --accent: #74c9ff;
      --accent-strong: #a5e0ff;
      --accent-soft: rgba(116, 201, 255, 0.12);
      --accent-border: rgba(116, 201, 255, 0.24);
      --accent-grad-a: #8bd7ff;
      --accent-grad-b: #5bbdf2;
      --accent-contrast: #052331;
      --success: #5cdb95;
      --success-soft: rgba(92, 219, 149, 0.10);
      --success-border: rgba(92, 219, 149, 0.22);
      --danger: #ff8585;
      --danger-soft: rgba(255, 133, 133, 0.10);
      --danger-border: rgba(255, 133, 133, 0.22);
      --shadow: 0 1.8rem 4rem -2.5rem rgba(0, 0, 0, 0.80);
      --toast-bg: #eaf7ff;
      --toast-text: #081820;
      --focus: rgba(116, 201, 255, 0.30);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(90% 55% at 100% 0%, var(--bg-glow), transparent 65%),
        radial-gradient(80% 45% at 0% 35%, var(--bg-glow-2), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    img,
    svg {
      display: block;
      max-width: 100%;
    }

    p,
    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    [hidden] {
      display: none !important;
    }

    :focus-visible {
      outline: 0.125rem solid var(--accent);
      outline-offset: 0.125rem;
    }

    ::selection {
      background: var(--accent-soft);
      color: var(--text);
    }

    .sr-only {
      position: absolute;
      width: 0.0625rem;
      height: 0.0625rem;
      padding: 0;
      margin: -0.0625rem;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      width: 100%;
      max-width: 44rem;
      margin: 0 auto;
      padding:
        max(0.85rem, env(safe-area-inset-top))
        clamp(0.85rem, 4vw, 1.6rem)
        calc(1.5rem + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      width: 100%;
      margin-bottom: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      flex: 1 1 auto;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: clamp(2.5rem, 9vw, 3rem);
      aspect-ratio: 1;
      flex: 0 0 auto;
      border-radius: 0.9rem;
      background: linear-gradient(145deg, var(--accent-grad-a), var(--accent-grad-b));
      color: var(--accent-contrast);
    }

    .brand-mark svg {
      width: 52%;
      height: auto;
    }

    .brand-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .brand-copy h1 {
      margin: 0.1rem 0 0;
      font-size: clamp(1.1rem, 4.6vw, 1.35rem);
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      min-height: 2.75rem;
      padding: 0 0.75rem;
      flex: 0 0 auto;
      border: 0.0625rem solid var(--line);
      border-radius: 99rem;
      background: var(--surface);
      color: var(--text-2);
      font-size: 0.8rem;
      font-weight: 700;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .theme-toggle:hover {
      border-color: var(--line-strong);
      background: var(--surface-2);
    }

    .theme-icon {
      display: inline-flex;
      width: 0.95rem;
      height: 0.95rem;
    }

    .hero {
      width: 100%;
      padding: clamp(1rem, 4.5vw, 1.5rem);
      border: 0.0625rem solid var(--line);
      border-radius: 1.5rem;
      background:
        radial-gradient(120% 80% at 100% 0%, var(--accent-soft), transparent 62%),
        var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .live-dot {
      width: 0.45rem;
      height: 0.45rem;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0.25rem var(--accent-soft);
      animation: pulse 2.6s ease-in-out infinite;
    }

    .date-chip {
      padding: 0.35rem 0.6rem;
      border: 0.0625rem solid var(--line);
      border-radius: 99rem;
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 0.78rem;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .empty-state {
      padding: clamp(1.2rem, 5vw, 1.8rem) 0 0.25rem;
      text-align: center;
    }

    .empty-art {
      width: min(8rem, 45vw);
      height: auto;
      margin: 0 auto 0.8rem;
    }

    .empty-state h2 {
      margin: 0 0 0.45rem;
      font-size: clamp(1.35rem, 6vw, 1.65rem);
      line-height: 1.25;
      letter-spacing: -0.025em;
    }

    .empty-state p {
      max-width: 27rem;
      margin: 0 auto;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.7;
    }

    .empty-state .btn {
      width: 100%;
      max-width: 14rem;
      margin: 1rem auto 0;
    }

    .person {
      display: flex;
      align-items: center;
      gap: clamp(0.7rem, 3vw, 1rem);
      min-width: 0;
      margin-top: 1rem;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: clamp(3.4rem, 14vw, 4.2rem);
      aspect-ratio: 1;
      flex: 0 0 clamp(3.4rem, 14vw, 4.2rem);
      border: 0.0625rem solid var(--accent-border);
      border-radius: 1.1rem;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: clamp(1.5rem, 7vw, 2rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .person-copy {
      flex: 1 1 auto;
      min-width: 0;
    }

    .person-name {
      margin: 0;
      font-size: clamp(1.9rem, 9vw, 2.5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.035em;
      overflow-wrap: anywhere;
    }

    .person-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem 0.6rem;
      margin-top: 0.5rem;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 1.55rem;
      padding: 0.25rem 0.55rem;
      border-radius: 99rem;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 0.75rem;
      line-height: 1.2;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-pill.pending {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .hint {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .water-info {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1rem;
    }

    .info-card {
      flex: 1 1 7.5rem;
      min-width: 0;
      padding: 0.7rem 0.8rem;
      border: 0.0625rem solid var(--line);
      border-radius: 1rem;
      background: var(--surface-2);
    }

    .info-card.water-stat {
      background: linear-gradient(135deg, var(--accent-soft), var(--surface-2));
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.35;
    }

    .water-days {
      display: block;
      margin-top: 0.15rem;
      color: var(--accent-strong);
      font-size: clamp(1.4rem, 6vw, 1.75rem);
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }

    .info-value {
      display: block;
      margin-top: 0.15rem;
      overflow: hidden;
      color: var(--text);
      font-size: 1rem;
      line-height: 1.35;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sub {
      display: block;
      margin-top: 0.15rem;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .action-notice {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.85rem;
      padding: 0.65rem 0.7rem;
      border: 0.0625rem solid var(--line);
      border-radius: 1rem;
      background: var(--surface-2);
    }

    .action-notice.is-done {
      border-color: var(--success-border);
      background: var(--success-soft);
    }

    .action-notice.is-skip {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .action-notice-icon {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      flex: 0 0 2rem;
      border-radius: 0.7rem;
      background: var(--surface);
      color: var(--text-2);
    }

    .action-notice.is-done .action-notice-icon {
      color: var(--success);
    }

    .action-notice.is-skip .action-notice-icon {
      color: var(--accent-strong);
    }

    .action-notice-icon svg {
      width: 1rem;
      height: 1rem;
    }

    .action-notice-copy {
      flex: 1 1 10rem;
      min-width: 0;
    }

    .action-notice-copy strong {
      display: block;
      color: var(--text);
      font-size: 0.85rem;
      line-height: 1.45;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .action-notice-copy span {
      display: block;
      margin-top: 0.1rem;
      color: var(--text-2);
      font-size: 0.78rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .notice-undo {
      min-height: 2.5rem;
      flex: 0 0 auto;
      padding: 0 0.7rem;
      border: 0.0625rem solid var(--line-strong);
      border-radius: 0.7rem;
      background: var(--surface);
      color: var(--text-2);
      font-size: 0.78rem;
      line-height: 1;
      font-weight: 700;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .action-notice.is-done .notice-undo {
      border-color: var(--success-border);
      color: var(--success);
    }

    .action-notice.is-skip .notice-undo {
      border-color: var(--accent-border);
      color: var(--accent-strong);
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1rem;
    }

    .action-row .btn {
      flex: 1 1 9.5rem;
      min-height: 3.25rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 2.9rem;
      padding: 0.65rem 0.9rem;
      border: 0;
      border-radius: 0.9rem;
      font-size: 0.95rem;
      line-height: 1.2;
      font-weight: 750;
      text-align: center;
      transition: transform 0.15s ease, filter 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn:active {
      transform: scale(0.985);
    }

    .btn svg {
      width: 1.1rem;
      height: 1.1rem;
      flex: 0 0 auto;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-grad-a), var(--accent-grad-b));
      color: var(--accent-contrast);
      box-shadow: 0 0.7rem 1.5rem -0.9rem var(--accent);
    }

    .btn-primary:hover {
      filter: brightness(1.03);
    }

    .btn-secondary {
      border: 0.0625rem solid var(--accent-border);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .btn-secondary:hover:not(:disabled) {
      filter: brightness(1.02);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .panel {
      width: 100%;
      margin-top: 1rem;
      padding: clamp(0.9rem, 4vw, 1.3rem);
      border: 0.0625rem solid var(--line);
      border-radius: 1.35rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .section-head h2 {
      margin: 0 0 0.15rem;
      font-size: 1rem;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: -0.015em;
    }

    .section-head p {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .count-badge {
      flex: 0 0 auto;
      padding: 0.3rem 0.55rem;
      border: 0.0625rem solid var(--line);
      border-radius: 99rem;
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 0.75rem;
      line-height: 1.2;
      font-weight: 700;
      white-space: nowrap;
    }

    .members {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin: 0.75rem 0 0;
      padding: 0;
      list-style: none;
    }

    .member-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
      padding: 0.55rem;
      border: 0.0625rem solid transparent;
      border-radius: 1rem;
      background: var(--surface-2);
    }

    .member-row.is-current {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .member-order {
      flex: 0 0 1.4rem;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .member-row.is-current .member-order {
      color: var(--accent-strong);
    }

    .member-avatar {
      display: grid;
      place-items: center;
      width: 2.25rem;
      height: 2.25rem;
      flex: 0 0 2.25rem;
      border: 0.0625rem solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      color: var(--text-2);
      font-size: 0.95rem;
      line-height: 1;
      font-weight: 800;
    }

    .member-row.is-current .member-avatar {
      border-color: var(--accent-border);
      color: var(--accent-strong);
    }

    .member-main {
      flex: 1 1 auto;
      min-width: 0;
    }

    .member-name-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem;
      min-width: 0;
    }

    .member-name {
      min-width: 0;
      flex: 0 1 auto;
      overflow: hidden;
      color: var(--text);
      font-size: 0.92rem;
      line-height: 1.35;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tag {
      flex: 0 0 auto;
      padding: 0.18rem 0.42rem;
      border-radius: 99rem;
      font-size: 0.75rem;
      line-height: 1.25;
      font-weight: 700;
      white-space: nowrap;
    }

    .tag-current {
      background: var(--accent);
      color: var(--accent-contrast);
    }

    .tag-next {
      border: 0.0625rem solid var(--line);
      background: var(--surface);
      color: var(--muted);
    }

    .member-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.1rem 0.6rem;
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.4;
    }

    .member-stat {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      white-space: nowrap;
    }

    .member-stat strong {
      color: var(--text-2);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .stat-dot {
      width: 0.32rem;
      height: 0.32rem;
      flex: 0 0 0.32rem;
      border-radius: 50%;
    }

    .stat-dot.normal {
      background: var(--success);
    }

    .stat-dot.leave {
      background: var(--accent);
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 2.75rem;
      height: 2.75rem;
      flex: 0 0 2.75rem;
      padding: 0;
      border: 0;
      border-radius: 0.75rem;
      background: transparent;
      color: var(--muted);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .icon-btn svg {
      width: 1.05rem;
      height: 1.05rem;
    }

    .mini-empty {
      margin: 0.75rem 0 0;
      padding: 1rem 0.8rem;
      border: 0.0625rem dashed var(--line-strong);
      border-radius: 0.9rem;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.6;
      text-align: center;
    }

    .add-form {
      display: flex;
      align-items: stretch;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.8rem;
    }

    .add-input {
      flex: 1 1 8rem;
      min-width: 0;
      height: 3rem;
      padding: 0 0.75rem;
      border: 0.0625rem solid var(--line-strong);
      border-radius: 0.8rem;
      outline: none;
      background: var(--surface-2);
      color: var(--text);
      font-size: 1rem;
      line-height: 1.2;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .add-input::placeholder {
      color: var(--muted);
      opacity: 0.9;
    }

    .add-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem var(--focus);
    }

    .add-input[aria-invalid="true"] {
      border-color: var(--danger);
      box-shadow: 0 0 0 0.2rem var(--danger-soft);
    }

    .btn-add {
      flex: 0 0 auto;
      min-height: 3rem;
      padding: 0 0.9rem;
      border-radius: 0.8rem;
      background: var(--text);
      color: var(--bg);
      font-size: 0.9rem;
      font-weight: 750;
    }

    .btn-add:hover {
      filter: brightness(1.06);
    }

    .btn-add svg {
      width: 1rem;
      height: 1rem;
    }

    .form-error {
      margin: 0.4rem 0.1rem 0;
      color: var(--danger);
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .clear-btn {
      min-height: 2.5rem;
      flex: 0 0 auto;
      padding: 0 0.55rem;
      border: 0;
      border-radius: 0.6rem;
      background: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.2;
      font-weight: 650;
    }

    .clear-btn:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .history-list {
      max-height: 26rem;
      margin: 0.75rem 0 0;
      padding: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      list-style: none;
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
    }

    .history-item {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      min-width: 0;
      padding: 0.65rem 0;
      border-bottom: 0.0625rem solid var(--line);
    }

    .history-item:last-child {
      border-bottom: 0;
    }

    .history-check {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      flex: 0 0 2rem;
      margin-top: 0.1rem;
      border-radius: 50%;
      background: var(--success-soft);
      color: var(--success);
    }

    .history-item.is-skip .history-check {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .history-check svg {
      width: 0.95rem;
      height: 0.95rem;
    }

    .history-main {
      flex: 1 1 auto;
      min-width: 0;
    }

    .history-name {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.3rem;
      min-width: 0;
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.45;
      font-weight: 700;
    }

    .history-done,
    .history-skip,
    .history-today {
      flex: 0 0 auto;
      padding: 0.16rem 0.4rem;
      border-radius: 0.3rem;
      font-size: 0.75rem;
      line-height: 1.25;
      font-weight: 750;
      white-space: nowrap;
    }

    .history-done {
      background: var(--success-soft);
      color: var(--success);
    }

    .history-skip {
      background: var(--accent);
      color: var(--accent-contrast);
    }

    .history-today {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .history-date {
      margin-top: 0.1rem;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-reason {
      margin-top: 0.15rem;
      color: var(--text-2);
      font-size: 0.78rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .history-side {
      display: flex;
      align-items: flex-end;
      flex-direction: column;
      gap: 0.15rem;
      flex: 0 0 auto;
    }

    .history-time {
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .history-action {
      display: grid;
      place-items: center;
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      border: 0;
      border-radius: 0.65rem;
      background: transparent;
      color: var(--muted);
    }

    .history-action:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .history-action.is-undo:hover {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .history-action svg {
      width: 0.95rem;
      height: 0.95rem;
    }

    .history-empty {
      padding: 1.4rem 0.5rem;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.7;
      text-align: center;
    }

    .history-empty svg {
      width: 1.5rem;
      height: 1.5rem;
      margin: 0 auto 0.4rem;
      opacity: 0.65;
    }

    .storage-note {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin: 1rem 0 0;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.5;
      text-align: center;
    }

    .storage-note svg {
      width: 0.8rem;
      height: 0.8rem;
      flex: 0 0 auto;
    }

    .storage-note.warn {
      color: var(--danger);
    }

    .reset-wrap {
      display: flex;
      justify-content: center;
      margin-top: 0.35rem;
    }

    .reset-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      min-height: 2.75rem;
      padding: 0 0.8rem;
      border: 0.0625rem solid transparent;
      border-radius: 99rem;
      background: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.2;
      font-weight: 650;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .reset-btn:hover {
      border-color: var(--danger-border);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .reset-btn svg {
      width: 0.85rem;
      height: 0.85rem;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(1rem + env(safe-area-inset-bottom));
      z-index: 50;
      width: max-content;
      max-width: min(92vw, 30rem);
      padding: 0.7rem 0.9rem;
      border-radius: 0.8rem;
      background: var(--toast-bg);
      color: var(--toast-text);
      box-shadow: 0 1rem 2rem -0.8rem rgba(0, 0, 0, 0.55);
      font-size: 0.82rem;
      line-height: 1.45;
      font-weight: 550;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 0.8rem);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    dialog {
      width: min(92vw, 27rem);
      max-width: 92vw;
      max-height: 90dvh;
      margin: auto;
      padding: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      border: 0.0625rem solid var(--line);
      border-radius: 1.2rem;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 2rem 5rem -1.5rem rgba(0, 0, 0, 0.55);
    }

    dialog::backdrop {
      background: rgba(4, 15, 22, 0.55);
      backdrop-filter: blur(0.2rem);
      -webkit-backdrop-filter: blur(0.2rem);
    }

    .dialog-body {
      padding: 1.2rem 1.1rem 0.9rem;
      text-align: center;
    }

    .dialog-icon {
      display: grid;
      place-items: center;
      width: 2.8rem;
      height: 2.8rem;
      margin: 0 auto 0.7rem;
      border-radius: 0.9rem;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .dialog-icon.skip-icon {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .dialog-icon svg {
      width: 1.3rem;
      height: 1.3rem;
    }

    .dialog-title {
      margin: 0 0 0.35rem;
      font-size: 1.05rem;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: -0.015em;
    }

    .dialog-text {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.6;
    }

    .dialog-actions {
      display: flex;
      gap: 0.55rem;
      padding: 0 1.1rem 1.1rem;
    }

    .dialog-actions .btn {
      flex: 1 1 0;
      min-height: 2.9rem;
      border-radius: 0.8rem;
      font-size: 0.85rem;
    }

    .btn-cancel {
      border: 0.0625rem solid var(--line);
      background: var(--surface-2);
      color: var(--text-2);
    }

    .btn-danger {
      background: var(--danger);
      color: #ffffff;
    }

    :root[data-theme="dark"] .btn-danger {
      color: #2a0b0b;
    }

    .btn-skip {
      background: linear-gradient(135deg, var(--accent-grad-a), var(--accent-grad-b));
      color: var(--accent-contrast);
    }

    .field-label {
      display: block;
      margin: 0.9rem 0 0.35rem;
      color: var(--text-2);
      font-size: 0.78rem;
      line-height: 1.4;
      font-weight: 700;
      text-align: left;
    }

    .field-input {
      width: 100%;
      height: 3rem;
      padding: 0 0.8rem;
      border: 0.0625rem solid var(--line-strong);
      border-radius: 0.8rem;
      outline: none;
      background: var(--surface-2);
      color: var(--text);
      font-size: 1rem;
      line-height: 1.2;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field-input::placeholder {
      color: var(--muted);
      opacity: 0.9;
    }

    .field-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem var(--focus);
    }

    .field-input[aria-invalid="true"] {
      border-color: var(--danger);
      box-shadow: 0 0 0 0.2rem var(--danger-soft);
    }

    .field-error {
      margin-top: 0.4rem;
      text-align: left;
    }

    .hero.celebrate .avatar {
      animation: pop 0.5s ease;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(0.82);
        opacity: 0.72;
      }
    }

    @keyframes pop {
      0% {
        transform: scale(1) rotate(0);
      }
      35% {
        transform: scale(1.08) rotate(-3deg);
      }
      70% {
        transform: scale(0.98) rotate(1deg);
      }
      100% {
        transform: scale(1) rotate(0);
      }
    }

    @media (max-width: 22em) {
      .action-row .btn {
        flex-basis: 100%;
      }

      .add-form .btn-add {
        flex: 1 1 100%;
      }

      .member-order {
        display: none;
      }

      .info-card {
        flex-basis: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.4c3.3 3.8 5.8 6.8 5.8 10.1a5.8 5.8 0 0 1-11.6 0c0-3.3 2.5-6.3 5.8-10.1Z"></path>
            <path d="M9.4 13.7c0 1.8 1.2 3 3 3"></path>
          </svg>
        </div>
        <div class="brand-copy">
          <p class="eyebrow">WATER DUTY</p>
          <h1>宿舍换水</h1>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题">
        <span class="theme-icon" id="themeIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M12 4v16" stroke-linecap="round"></path>
            <path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"></path>
          </svg>
        </span>
        <span id="themeLabel">自动</span>
      </button>
    </header>

    <main>
      <section class="hero" id="waterCard" aria-label="当前换水">
        <div class="hero-top">
          <p class="kicker"><span class="live-dot" aria-hidden="true"></span>当前换水</p>
          <span class="date-chip" id="todayDate"></span>
        </div>

        <div class="empty-state" id="heroEmpty" hidden>
          <svg class="empty-art" viewBox="0 0 120 120" fill="none" aria-hidden="true">
            <circle cx="60" cy="58" r="47" fill="var(--accent-soft)"></circle>
            <path d="M49 30h22v8l7 10v33a7 7 0 0 1-7 7H49a7 7 0 0 1-7-7V48l7-10v-8Z" fill="var(--surface)" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"></path>
            <path d="M47 27h26" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"></path>
            <path d="M45 66h30v14a5 5 0 0 1-5 5H50a5 5 0 0 1-5-5V66Z" fill="var(--accent-soft)"></path>
            <path d="M43 66c4.5 3 9.5 3 14 0s9.5-3 14 0" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"></path>
            <path d="M59 51c2.4 2.9 4.3 4.9 4.3 7a4.3 4.3 0 1 1-8.6 0c0-2.1 1.9-4.1 4.3-7Z" fill="var(--accent)" opacity=".7"></path>
            <path d="M31 35l1.8 4.2L37 41l-4.2 1.8L31 47l-1.8-4.2L25 41l4.2-1.8L31 35Z" fill="var(--accent)" opacity=".82"></path>
            <path d="M87 75l1.2 2.8 2.8 1.2-2.8 1.2L87 83l-1.2-2.8-2.8-1.2 2.8-1.2L87 75Z" fill="var(--accent)" opacity=".5"></path>
          </svg>
          <h2>先添加第一位室友</h2>
          <p>名单添加后，从第一位室友开始按次轮换。完成或跳过，都会自动顺延给下一位。</p>
          <button class="btn btn-primary" type="button" data-focus-add>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            添加室友
          </button>
        </div>

        <div id="heroActive" hidden>
          <div class="person">
            <div class="avatar" id="currentAvatar" aria-hidden="true"></div>
            <div class="person-copy">
              <h2 class="person-name" id="currentName"></h2>
              <div class="person-meta">
                <span class="status-pill pending" id="statusPill">该换水啦</span>
                <span class="hint" id="dutyNote">完成或跳过都会顺延</span>
              </div>
            </div>
          </div>

          <div class="water-info">
            <div class="info-card water-stat">
              <span class="label">这桶水已经喝了</span>
              <strong class="water-days" id="waterDays">—</strong>
              <span class="sub" id="waterLast">暂无换水记录</span>
            </div>
            <div class="info-card">
              <span class="label">下一位</span>
              <strong class="info-value" id="nextMemberValue">—</strong>
              <span class="sub" id="nextMemberSub">完成或跳过后接棒</span>
            </div>
          </div>

          <div class="action-notice" id="actionNotice" hidden>
            <span class="action-notice-icon" id="actionNoticeIcon" aria-hidden="true"></span>
            <span class="action-notice-copy">
              <strong id="actionNoticeTitle"></strong>
              <span id="actionNoticeText"></span>
            </span>
            <button class="notice-undo" id="undoActionBtn" type="button">撤销</button>
          </div>

          <div class="action-row">
            <button class="btn btn-primary" id="completeBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m5 12.5 4.2 4.2L19 7"></path>
              </svg>
              完成换水
            </button>
            <button class="btn btn-secondary" id="skipBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h13"></path>
                <path d="m13 7 5 5-5 5"></path>
              </svg>
              跳过/不在
            </button>
          </div>
        </div>
      </section>

      <section class="panel" aria-labelledby="membersTitle">
        <div class="section-head">
          <div>
            <h2 id="membersTitle">换水顺序</h2>
            <p>完成或跳过后，自动顺延给下一位</p>
          </div>
          <span class="count-badge" id="memberCount">0 人</span>
        </div>

        <ul class="members" id="memberList"></ul>
        <p class="mini-empty" id="memberEmpty" hidden>还没有室友，先添加一个吧。</p>

        <form class="add-form" id="addForm" novalidate>
          <label class="sr-only" for="nameInput">室友名字</label>
          <input
            class="add-input"
            id="nameInput"
            type="text"
            placeholder="输入室友名字"
            maxlength="16"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="done"
            aria-describedby="nameError"
          >
          <button class="btn btn-add" type="submit" aria-label="添加室友">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            <span>添加</span>
          </button>
        </form>
        <p class="form-error" id="nameError" role="alert" hidden></p>
      </section>

      <section class="panel" aria-labelledby="historyTitle">
        <div class="section-head">
          <div>
            <h2 id="historyTitle">换水记录</h2>
            <p id="historyHint">完成或跳过第一次换水后，记录会出现在这里</p>
          </div>
          <button class="clear-btn" id="clearHistoryBtn" type="button" hidden>清空记录</button>
        </div>
        <ul class="history-list" id="historyList"></ul>
      </section>

      <p class="storage-note" id="storageNote">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2.5"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
        <span id="storageText">已开启本地保存 · 刷新不丢失</span>
      </p>
      <div class="reset-wrap">
        <button class="reset-btn" id="resetDataBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h16M9.5 7V5.4c0-.8.6-1.4 1.4-1.4h2.2c.8 0 1.4.6 1.4 1.4V7M6.4 7l.8 12c.1 1 .9 1.7 1.9 1.7h5.8c1 0 1.8-.7 1.9-1.7l.8-12"></path>
            <path d="M10 11v5.5M14 11v5.5"></path>
          </svg>
          重置所有数据
        </button>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="confirmDialog" aria-labelledby="dialogTitle" aria-describedby="dialogText">
    <form method="dialog">
      <div class="dialog-body">
        <div class="dialog-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 9v4"></path>
            <path d="M12 17h.01"></path>
            <path d="M10.3 4.2 2.8 17.5A2 2 0 0 0 4.5 20h15a2 2 0 0 0 1.7-2.5L13.7 4.2a2 2 0 0 0-3.4 0Z"></path>
          </svg>
        </div>
        <h2 class="dialog-title" id="dialogTitle">确认操作？</h2>
        <p class="dialog-text" id="dialogText"></p>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-cancel" type="submit" value="cancel">取消</button>
        <button class="btn btn-danger" id="dialogConfirm" type="submit" value="confirm">确认</button>
      </div>
    </form>
  </dialog>

  <dialog id="skipDialog" aria-labelledby="skipTitle" aria-describedby="skipText skipError">
    <form id="skipForm">
      <div class="dialog-body">
        <div class="dialog-icon skip-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h13"></path>
            <path d="m13 7 5 5-5 5"></path>
          </svg>
        </div>
        <h2 class="dialog-title" id="skipTitle">跳过 / 不在</h2>
        <p class="dialog-text" id="skipText"></p>
        <label class="field-label" for="skipReason">跳过原因</label>
        <input
          class="field-input"
          id="skipReason"
          type="text"
          maxlength="40"
          placeholder="例如：不在宿舍、临时外出"
          autocomplete="off"
          enterkeyhint="done"
          aria-describedby="skipText skipError"
        >
        <p class="form-error field-error" id="skipError" role="alert" hidden></p>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-cancel" id="skipCancel" type="button">取消</button>
        <button class="btn btn-skip" type="submit">确认跳过</button>
      </div>
    </form>
  </dialog>

  <script>

    (function () {
      'use strict';

      var STORAGE_KEY = 'dorm-water:v1';
      var MAX_NAME_LENGTH = 16;
      var MAX_REASON_LENGTH = 40;
      var THEME_ORDER = ['auto', 'dark', 'light'];
      var WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      var darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

      var ICONS = {
        auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4v16" stroke-linecap="round"></path><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"></path></svg>',
        dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 14.4A8.5 8.5 0 0 1 9.6 3.8 8.5 8.5 0 1 0 20.2 14.4Z"></path></svg>',
        light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.8v2M12 19.2v2M21.2 12h-2M4.8 12h-2M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4M18.5 18.5l-1.4-1.4M6.9 6.9 5.5 5.5"></path></svg>',
        trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9.5 7V5.4c0-.8.6-1.4 1.4-1.4h2.2c.8 0 1.4.6 1.4 1.4V7M6.4 7l.8 12c.1 1 .9 1.7 1.9 1.7h5.8c1 0 1.8-.7 1.9-1.7l.8-12"></path><path d="M10 11v5.5M14 11v5.5"></path></svg>',
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.2 4.2L19 7"></path></svg>',
        skip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"></path><path d="m13 7 5 5-5 5"></path></svg>',
        undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7 4 12l5 5"></path><path d="M4 12h9a6 6 0 0 1 6 6v1"></path></svg>',
        emptyHistory: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12a1.5 1.5 0 0 1 1.5 1.5v15L12 16.5 4.5 20V5A1.5 1.5 0 0 1 6 3.5Z"></path><path d="M8.5 8h7M8.5 11.5h4"></path></svg>'
      };

      var els = {
        waterCard: document.getElementById('waterCard'),
        todayDate: document.getElementById('todayDate'),
        heroEmpty: document.getElementById('heroEmpty'),
        heroActive: document.getElementById('heroActive'),
        currentAvatar: document.getElementById('currentAvatar'),
        currentName: document.getElementById('currentName'),
        statusPill: document.getElementById('statusPill'),
        dutyNote: document.getElementById('dutyNote'),
        waterDays: document.getElementById('waterDays'),
        waterLast: document.getElementById('waterLast'),
        nextMemberValue: document.getElementById('nextMemberValue'),
        nextMemberSub: document.getElementById('nextMemberSub'),
        actionNotice: document.getElementById('actionNotice'),
        actionNoticeIcon: document.getElementById('actionNoticeIcon'),
        actionNoticeTitle: document.getElementById('actionNoticeTitle'),
        actionNoticeText: document.getElementById('actionNoticeText'),
        undoActionBtn: document.getElementById('undoActionBtn'),
        completeBtn: document.getElementById('completeBtn'),
        skipBtn: document.getElementById('skipBtn'),
        memberCount: document.getElementById('memberCount'),
        memberList: document.getElementById('memberList'),
        memberEmpty: document.getElementById('memberEmpty'),
        addForm: document.getElementById('addForm'),
        nameInput: document.getElementById('nameInput'),
        nameError: document.getElementById('nameError'),
        historyHint: document.getElementById('historyHint'),
        historyList: document.getElementById('historyList'),
        clearHistoryBtn: document.getElementById('clearHistoryBtn'),
        resetDataBtn: document.getElementById('resetDataBtn'),
        storageNote: document.getElementById('storageNote'),
        storageText: document.getElementById('storageText'),
        themeToggle: document.getElementById('themeToggle'),
        themeIcon: document.getElementById('themeIcon'),
        themeLabel: document.getElementById('themeLabel'),
        toast: document.getElementById('toast'),
        dialog: document.getElementById('confirmDialog'),
        dialogTitle: document.getElementById('dialogTitle'),
        dialogText: document.getElementById('dialogText'),
        dialogConfirm: document.getElementById('dialogConfirm'),
        skipDialog: document.getElementById('skipDialog'),
        skipForm: document.getElementById('skipForm'),
        skipText: document.getElementById('skipText'),
        skipReason: document.getElementById('skipReason'),
        skipError: document.getElementById('skipError'),
        skipCancel: document.getElementById('skipCancel')
      };

      var storageOK = true;
      var state = loadState();
      var lastDay = todayKey();
      var toastTimer = null;
      var pendingConfirm = null;
      var dialogReturnFocus = null;
      var skipReturnFocus = null;
      var actionLockUntil = 0;

      init();

      function init() {
        ensureCurrent();
        normalizeLastWaterDate();
        cleanupLastAction();
        saveState();
        bindEvents();
        updateStorageNote();
        applyTheme();
        render();
        lastDay = todayKey();
        window.setInterval(checkDayChange, 30000);
      }

      function bindEvents() {
        els.addForm.addEventListener('submit', handleAddMember);
        els.completeBtn.addEventListener('click', handleComplete);
        els.skipBtn.addEventListener('click', openSkipDialog);
        els.undoActionBtn.addEventListener('click', function () {
          undoLastAction();
        });
        els.clearHistoryBtn.addEventListener('click', requestClearHistory);
        els.resetDataBtn.addEventListener('click', requestResetAll);
        els.themeToggle.addEventListener('click', cycleTheme);
        els.nameInput.addEventListener('input', clearNameError);

        els.memberList.addEventListener('click', function (event) {
          var button = event.target.closest('[data-delete-id]');
          if (!button) return;
          requestDeleteMember(button.getAttribute('data-delete-id'));
        });

        els.historyList.addEventListener('click', function (event) {
          var button = event.target.closest('[data-history-id]');
          if (!button) return;
          requestDeleteHistory(button.getAttribute('data-history-id'));
        });

        els.skipReason.addEventListener('input', clearSkipError);
        els.skipForm.addEventListener('submit', handleSkipSubmit);
        els.skipCancel.addEventListener('click', function () {
          els.skipDialog.close('cancel');
        });
        els.skipDialog.addEventListener('click', function (event) {
          if (event.target === els.skipDialog) {
            els.skipDialog.close('cancel');
          }
        });
        els.skipDialog.addEventListener('close', function () {
          if (skipReturnFocus && skipReturnFocus.isConnected && typeof skipReturnFocus.focus === 'function') {
            skipReturnFocus.focus({ preventScroll: true });
          }
          skipReturnFocus = null;
        });

        document.addEventListener('click', function (event) {
          var trigger = event.target.closest('[data-focus-add]');
          if (!trigger) return;
          var behavior = reduceMotion.matches ? 'auto' : 'smooth';
          els.nameInput.focus({ preventScroll: true });
          els.nameInput.scrollIntoView({ behavior: behavior, block: 'center' });
        });

        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) checkDayChange();
        });
        window.addEventListener('focus', checkDayChange);

        if (typeof darkQuery.addEventListener === 'function') {
          darkQuery.addEventListener('change', function () {
            if (state.settings.theme === 'auto') applyTheme();
          });
        } else if (typeof darkQuery.addListener === 'function') {
          darkQuery.addListener(function () {
            if (state.settings.theme === 'auto') applyTheme();
          });
        }

        els.dialog.addEventListener('close', function () {
          var callback = pendingConfirm;
          pendingConfirm = null;
          if (els.dialog.returnValue === 'confirm' && typeof callback === 'function') {
            callback();
          }
          if (dialogReturnFocus && dialogReturnFocus.isConnected && typeof dialogReturnFocus.focus === 'function') {
            dialogReturnFocus.focus({ preventScroll: true });
          }
          dialogReturnFocus = null;
        });

        els.dialog.addEventListener('click', function (event) {
          if (event.target === els.dialog) {
            els.dialog.close('cancel');
          }
        });
      }

      function createEmptyState() {
        return {
          version: 1,
          members: [],
          currentMemberId: null,
          lastWaterDate: null,
          history: [],
          lastAction: null,
          settings: { theme: 'auto' }
        };
      }

      function loadState() {
        var parsed = null;
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) parsed = JSON.parse(raw);
        } catch (error) {
          storageOK = false;
        }

        if (!parsed || typeof parsed !== 'object') return createEmptyState();

        var next = createEmptyState();
        var memberIds = new Set();
        var rawMembers = Array.isArray(parsed.members) ? parsed.members : [];

        rawMembers.forEach(function (item) {
          if (!item || typeof item !== 'object') return;
          var name = normalizeName(item.name);
          if (!name) return;
          var id = typeof item.id === 'string' && item.id.trim() ? item.id.trim() : makeId();
          while (memberIds.has(id)) id = makeId();
          memberIds.add(id);
          next.members.push({
            id: id,
            name: truncateName(name),
            createdAt: validISO(item.createdAt) || new Date().toISOString()
          });
        });

        var current = typeof parsed.currentMemberId === 'string' ? parsed.currentMemberId : '';
        if (memberIds.has(current)) next.currentMemberId = current;

        var lastWaterDate = normalizeDateKey(parsed.lastWaterDate);
        if (lastWaterDate) next.lastWaterDate = lastWaterDate;

        var historyIds = new Set();
        var rawHistory = Array.isArray(parsed.history) ? parsed.history : [];
        rawHistory.forEach(function (item) {
          if (!item || typeof item !== 'object') return;
          var date = normalizeDateKey(item.date);
          var memberName = truncateName(normalizeName(item.memberName));
          if (!date || !memberName) return;
          var id = typeof item.id === 'string' && item.id.trim() ? item.id.trim() : makeId();
          while (historyIds.has(id)) id = makeId();
          historyIds.add(id);
          var checkedAt = validISO(item.checkedAt);
          if (!checkedAt) {
            var fallback = new Date(date + 'T12:00:00');
            checkedAt = isNaN(fallback.getTime()) ? new Date().toISOString() : fallback.toISOString();
          }
          var type = item.type === 'skip' ? 'skip' : 'done';
          next.history.push({
            id: id,
            type: type,
            date: date,
            memberId: typeof item.memberId === 'string' ? item.memberId : '',
            memberName: memberName,
            reason: type === 'skip' ? (truncateReason(normalizeReason(item.reason)) || '未填写原因') : '',
            checkedAt: checkedAt
          });
        });

        next.history.sort(sortHistory);

        if (parsed.lastAction && typeof parsed.lastAction === 'object') {
          var actionType = parsed.lastAction.type === 'skip' ? 'skip' : (parsed.lastAction.type === 'done' ? 'done' : '');
          var recordId = typeof parsed.lastAction.recordId === 'string' ? parsed.lastAction.recordId : '';
          var fromMemberId = typeof parsed.lastAction.fromMemberId === 'string' ? parsed.lastAction.fromMemberId : '';
          var toMemberId = typeof parsed.lastAction.toMemberId === 'string' ? parsed.lastAction.toMemberId : '';
          if (actionType && recordId && memberIds.has(fromMemberId) && memberIds.has(toMemberId)) {
            next.lastAction = {
              recordId: recordId,
              type: actionType,
              fromMemberId: fromMemberId,
              toMemberId: toMemberId,
              previousWaterDate: normalizeDateKey(parsed.lastAction.previousWaterDate),
              createdAt: validISO(parsed.lastAction.createdAt) || new Date().toISOString()
            };
          }
        }

        if (parsed.settings && THEME_ORDER.indexOf(parsed.settings.theme) !== -1) {
          next.settings.theme = parsed.settings.theme;
        }
        return next;
      }

      function saveState() {
        if (!storageOK) return false;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          return true;
        } catch (error) {
          storageOK = false;
          updateStorageNote();
          toast('本地存储不可用，数据无法保存');
          return false;
        }
      }

      function updateStorageNote() {
        if (!els.storageNote) return;
        if (storageOK) {
          els.storageText.textContent = '已开启本地保存 · 刷新不丢失';
          els.storageNote.classList.remove('warn');
        } else {
          els.storageText.textContent = '当前浏览器禁用了本地存储，刷新后数据会丢失';
          els.storageNote.classList.add('warn');
        }
      }

      function normalizeName(value) {
        if (typeof value !== 'string') return '';
        return value.trim().replace(/\s+/g, ' ');
      }

      function truncateName(name) {
        return Array.from(name).slice(0, MAX_NAME_LENGTH).join('');
      }

      function normalizeReason(value) {
        if (typeof value !== 'string') return '';
        return value.trim().replace(/\s+/g, ' ');
      }

      function truncateReason(reason) {
        return Array.from(reason).slice(0, MAX_REASON_LENGTH).join('');
      }

      function makeId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
      }

      function pad(value) {
        return String(value).padStart(2, '0');
      }

      function dateKey(date) {
        return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
      }

      function todayKey() {
        return dateKey(new Date());
      }

      function keyToDate(key) {
        var parts = key.split('-').map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0);
      }

      function normalizeDateKey(value) {
        if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
        var parts = value.split('-').map(Number);
        var date = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0);
        if (
          date.getFullYear() !== parts[0] ||
          date.getMonth() !== parts[1] - 1 ||
          date.getDate() !== parts[2]
        ) return null;
        return value;
      }

      function daysBetween(fromKey, toKey) {
        var from = fromKey.split('-').map(Number);
        var to = toKey.split('-').map(Number);
        var fromUTC = Date.UTC(from[0], from[1] - 1, from[2]);
        var toUTC = Date.UTC(to[0], to[1] - 1, to[2]);
        return Math.round((toUTC - fromUTC) / 86400000);
      }

      function weekdayName(key) {
        return WEEKDAYS[keyToDate(key).getDay()];
      }

      function formatMonthDay(key) {
        var date = keyToDate(key);
        return (date.getMonth() + 1) + '月' + date.getDate() + '日';
      }

      function formatWaterDate(key) {
        var date = keyToDate(key);
        if (date.getFullYear() !== new Date().getFullYear()) {
          return date.getFullYear() + '年' + formatMonthDay(key);
        }
        return formatMonthDay(key);
      }

      function formatChip(key) {
        return formatMonthDay(key) + ' ' + weekdayName(key);
      }

      function formatFullDate(key) {
        var date = keyToDate(key);
        return date.getFullYear() + '年' + formatMonthDay(key) + ' ' + weekdayName(key);
      }

      function formatHistoryDate(key, today) {
        var date = keyToDate(key);
        var base = formatMonthDay(key) + ' ' + weekdayName(key);
        if (key === today) return '今天 · ' + base;
        if (key === addDaysKey(today, -1)) return '昨天 · ' + base;
        if (date.getFullYear() !== new Date().getFullYear()) return date.getFullYear() + '年' + base;
        return base;
      }

      function addDaysKey(key, amount) {
        var parts = key.split('-').map(Number);
        return dateKey(new Date(parts[0], parts[1] - 1, parts[2] + amount, 12, 0, 0, 0));
      }

      function formatTime(iso) {
        var date = new Date(iso);
        if (isNaN(date.getTime())) return '--:--';
        return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
      }

      function formatTimestamp(iso) {
        var date = new Date(iso);
        if (isNaN(date.getTime())) return '';
        try {
          return new Intl.DateTimeFormat('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'short',
            hour: '2-digit',
            minute: '2-digit'
          }).format(date);
        } catch (error) {
          return date.toLocaleString('zh-CN');
        }
      }

      function validISO(value) {
        if (typeof value !== 'string' || !value) return null;
        var date = new Date(value);
        return isNaN(date.getTime()) ? null : date.toISOString();
      }

      function sortHistory(a, b) {
        var byTime = String(b.checkedAt).localeCompare(String(a.checkedAt));
        if (byTime !== 0) return byTime;
        return String(b.date).localeCompare(String(a.date));
      }

      function ensureCurrent() {
        if (!state.members.length) {
          state.currentMemberId = null;
          return false;
        }
        if (!state.currentMemberId || !state.members.some(function (member) {
          return member.id === state.currentMemberId;
        })) {
          state.currentMemberId = state.members[0].id;
        }
        return true;
      }

      function normalizeLastWaterDate() {
        if (state.lastWaterDate && normalizeDateKey(state.lastWaterDate)) return;
        var latest = null;
        state.history.forEach(function (record) {
          if (record.type !== 'skip' && (!latest || record.date > latest)) latest = record.date;
        });
        state.lastWaterDate = latest;
      }

      function currentMember() {
        if (!state.currentMemberId) return null;
        return state.members.find(function (member) {
          return member.id === state.currentMemberId;
        }) || null;
      }

      function nextMemberFor(member) {
        if (!member || !state.members.length) return null;
        var index = state.members.findIndex(function (item) {
          return item.id === member.id;
        });
        if (index === -1) return null;
        return state.members[(index + 1) % state.members.length];
      }

      function getWaterDays() {
        if (!state.lastWaterDate) return null;
        return Math.max(0, daysBetween(state.lastWaterDate, todayKey()));
      }

      function getActiveAction() {
        var action = state.lastAction;
        if (!action) return null;
        if (action.type !== 'done' && action.type !== 'skip') return null;
        if (!state.currentMemberId || state.currentMemberId !== action.toMemberId) return null;

        var record = state.history.find(function (item) {
          return item.id === action.recordId && item.type === action.type;
        });
        if (!record) return null;
        var from = state.members.find(function (member) {
          return member.id === action.fromMemberId;
        });
        var to = state.members.find(function (member) {
          return member.id === action.toMemberId;
        });
        if (!from || !to) return null;
        if (action.type === 'done' && state.lastWaterDate !== record.date) return null;
        return { action: action, record: record, from: from, to: to };
      }

      function cleanupLastAction() {
        if (state.lastAction && !getActiveAction()) state.lastAction = null;
      }

      function buildMemberStats() {
        var stats = {};
        state.members.forEach(function (member) {
          stats[member.id] = { normal: 0, skip: 0 };
        });
        state.history.forEach(function (record) {
          if (!stats[record.memberId]) return;
          if (record.type === 'skip') stats[record.memberId].skip += 1;
          else stats[record.memberId].normal += 1;
        });
        return stats;
      }

      function getInitial(name) {
        return Array.from(String(name).trim())[0] || '?';
      }

      function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, function (character) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
          }[character];
        });
      }

      function render() {
        var today = todayKey();
        els.todayDate.textContent = formatChip(today);
        els.todayDate.title = formatFullDate(today);
        els.memberCount.textContent = state.members.length + ' 人';

        if (!state.members.length) {
          els.heroEmpty.hidden = false;
          els.heroActive.hidden = true;
          els.waterCard.classList.remove('celebrate');
          els.actionNotice.hidden = true;
          els.memberList.hidden = true;
          els.memberList.innerHTML = '';
          els.memberEmpty.hidden = false;
          renderHistory(today);
          return;
        }

        els.heroEmpty.hidden = true;
        els.heroActive.hidden = false;
        els.memberEmpty.hidden = true;
        els.memberList.hidden = false;

        ensureCurrent();
        var current = currentMember();
        if (!current) return;
        var next = nextMemberFor(current);
        var days = getWaterDays();
        var active = getActiveAction();

        els.currentName.textContent = current.name;
        els.currentAvatar.textContent = getInitial(current.name);
        els.statusPill.textContent = '该换水啦';
        els.statusPill.classList.remove('done');
        els.statusPill.classList.add('pending');
        els.dutyNote.textContent = '完成或跳过都会顺延';

        if (days === null) {
          els.waterDays.textContent = '—';
          els.waterDays.title = '';
          els.waterLast.textContent = '暂无换水记录';
        } else {
          els.waterDays.textContent = days + ' 天';
          els.waterDays.title = '上次换水：' + formatFullDate(state.lastWaterDate);
          if (days === 0 && state.lastWaterDate === today) {
            els.waterLast.textContent = '今天刚换';
          } else {
            els.waterLast.textContent = '上次换水 · ' + formatWaterDate(state.lastWaterDate);
          }
        }

        els.nextMemberValue.textContent = next ? next.name : '—';
        els.nextMemberValue.title = next ? next.name : '';
        els.nextMemberSub.textContent = state.members.length === 1 ? '目前只有 1 人' : '完成或跳过后接棒';
        els.completeBtn.setAttribute('aria-label', '完成换水：' + current.name);
        els.skipBtn.disabled = state.members.length < 2;
        els.skipBtn.title = state.members.length < 2 ? '只有一位室友，无法跳过' : '跳过本次换水并顺延给下一位';
        els.skipBtn.setAttribute('aria-label', state.members.length < 2 ? '跳过不可用：只有一位室友' : '跳过/不在，将本次换水顺延给 ' + (next ? next.name : '下一位'));

        if (active) {
          els.actionNotice.hidden = false;
          els.actionNotice.classList.toggle('is-done', active.action.type === 'done');
          els.actionNotice.classList.toggle('is-skip', active.action.type === 'skip');
          if (active.action.type === 'done') {
            els.actionNoticeIcon.innerHTML = ICONS.check;
            els.actionNoticeTitle.textContent = active.from.name + ' 完成换水';
            els.actionNoticeText.textContent = active.from.id === active.to.id
              ? '名单中只有 1 人，继续由你负责 · ' + formatWaterDate(active.record.date)
              : '已顺延给 ' + active.to.name + ' · ' + formatWaterDate(active.record.date);
            els.undoActionBtn.textContent = '撤销完成';
          } else {
            els.actionNoticeIcon.innerHTML = ICONS.skip;
            els.actionNoticeTitle.textContent = active.from.name + ' 跳过/不在';
            els.actionNoticeText.textContent = '原因：' + active.record.reason + ' · 已顺延给 ' + active.to.name;
            els.undoActionBtn.textContent = '撤销跳过';
          }
        } else {
          els.actionNotice.hidden = true;
          els.actionNotice.classList.remove('is-done', 'is-skip');
        }

        renderMembers(current.id, next ? next.id : null);
        renderHistory(today, active);
      }

      function renderMembers(currentId, nextId) {
        var multiple = state.members.length > 1;
        var stats = buildMemberStats();
        els.memberList.innerHTML = state.members.map(function (member, index) {
          var isCurrent = member.id === currentId;
          var isNext = multiple && member.id === nextId && !isCurrent;
          var memberStats = stats[member.id] || { normal: 0, skip: 0 };
          var tag = '';
          if (isCurrent) tag = '<span class="tag tag-current">当前</span>';
          else if (isNext) tag = '<span class="tag tag-next">下一位</span>';

          return '<li class="member-row' + (isCurrent ? ' is-current' : '') + '"' + (isCurrent ? ' aria-current="true"' : '') + '>' +
            '<span class="member-order" aria-hidden="true">' + pad(index + 1) + '</span>' +
            '<span class="member-avatar" aria-hidden="true">' + escapeHTML(getInitial(member.name)) + '</span>' +
            '<div class="member-main">' +
              '<div class="member-name-line">' +
                '<span class="member-name" title="' + escapeHTML(member.name) + '">' + escapeHTML(member.name) + '</span>' +
                tag +
              '</div>' +
              '<div class="member-stats" title="正常换水 ' + memberStats.normal + ' 次，跳过少换 ' + memberStats.skip + ' 次">' +
                '<span class="member-stat"><span class="stat-dot normal" aria-hidden="true"></span>正常换水 <strong>' + memberStats.normal + '</strong> 次</span>' +
                ' ' +
                '<span class="member-stat"><span class="stat-dot leave" aria-hidden="true"></span>跳过少换 <strong>' + memberStats.skip + '</strong> 次</span>' +
              '</div>' +
            '</div>' +
            '<button class="icon-btn" type="button" data-delete-id="' + escapeHTML(member.id) + '" aria-label="将 ' + escapeHTML(member.name) + ' 移出换水名单" title="移出名单">' + ICONS.trash + '</button>' +
          '</li>';
        }).join('');
      }

      function renderHistory(today, activeAction) {
        var records = state.history;
        var doneCount = records.filter(function (record) { return record.type !== 'skip'; }).length;
        var skipCount = records.filter(function (record) { return record.type === 'skip'; }).length;
        els.historyHint.textContent = records.length
          ? '共 ' + doneCount + ' 次换水 · ' + skipCount + ' 次跳过'
          : '完成或跳过第一次换水后，记录会出现在这里';
        els.clearHistoryBtn.hidden = records.length === 0;

        if (!records.length) {
          els.historyList.innerHTML = '<li class="history-empty">' + ICONS.emptyHistory + '还没有换水记录<br>完成或跳过第一次换水后，这里会自动记录。</li>';
          return;
        }

        els.historyList.innerHTML = records.map(function (record) {
          var isSkip = record.type === 'skip';
          var isActive = Boolean(activeAction && activeAction.record.id === record.id);
          var todayTag = record.date === today ? '<span class="history-today">今天</span>' : '';
          var typeTag = isSkip ? '<span class="history-skip">跳过</span>' : '<span class="history-done">换水</span>';
          var reason = isSkip
            ? '<div class="history-reason">原因：' + escapeHTML(record.reason) + '</div>'
            : '';
          var actionLabel = isActive
            ? (isSkip ? '撤销这次跳过' : '撤销这次换水')
            : '删除这条记录';
          var actionIcon = isActive ? ICONS.undo : ICONS.trash;

          return '<li class="history-item' + (isSkip ? ' is-skip' : '') + '">' +
            '<span class="history-check" aria-hidden="true">' + (isSkip ? ICONS.skip : ICONS.check) + '</span>' +
            '<div class="history-main">' +
              '<div class="history-name">' + escapeHTML(record.memberName) + typeTag + todayTag + '</div>' +
              '<div class="history-date">' + escapeHTML(formatHistoryDate(record.date, today)) + '</div>' +
              reason +
            '</div>' +
            '<div class="history-side">' +
              '<time class="history-time" datetime="' + escapeHTML(record.checkedAt) + '" title="' + escapeHTML(formatTimestamp(record.checkedAt)) + '">' + escapeHTML(formatTime(record.checkedAt)) + '</time>' +
              '<button class="history-action' + (isActive ? ' is-undo' : '') + '" type="button" data-history-id="' + escapeHTML(record.id) + '" aria-label="' + actionLabel + '：' + escapeHTML(record.memberName) + ' ' + escapeHTML(formatMonthDay(record.date)) + '" title="' + actionLabel + '">' + actionIcon + '</button>' +
            '</div>' +
          '</li>';
        }).join('');
      }

      function handleAddMember(event) {
        event.preventDefault();
        var name = normalizeName(els.nameInput.value);

        if (!name) {
          showNameError('请输入室友名字');
          return;
        }
        if (Array.from(name).length > MAX_NAME_LENGTH) {
          showNameError('名字最多 ' + MAX_NAME_LENGTH + ' 个字');
          return;
        }
        var duplicated = state.members.some(function (member) {
          return member.name.toLocaleLowerCase() === name.toLocaleLowerCase();
        });
        if (duplicated) {
          showNameError('名单中已有「' + name + '」');
          return;
        }

        var member = {
          id: makeId(),
          name: name,
          createdAt: new Date().toISOString()
        };
        state.members.push(member);
        if (!state.currentMemberId) state.currentMemberId = member.id;

        clearNameError();
        els.nameInput.value = '';
        saveState();
        render();
        toast(state.members.length === 1
          ? '已添加 ' + member.name + '，从 TA 开始换水'
          : member.name + ' 已加入换水名单');
        els.nameInput.focus({ preventScroll: true });
      }

      function showNameError(message) {
        els.nameError.textContent = message;
        els.nameError.hidden = false;
        els.nameInput.setAttribute('aria-invalid', 'true');
        els.nameInput.focus({ preventScroll: true });
      }

      function clearNameError() {
        if (els.nameError.hidden) return;
        els.nameError.textContent = '';
        els.nameError.hidden = true;
        els.nameInput.removeAttribute('aria-invalid');
      }

      function requestDeleteMember(id) {
        var member = state.members.find(function (item) {
          return item.id === id;
        });
        if (!member) return;

        var isCurrent = state.currentMemberId === id;
        var message;
        if (isCurrent && state.members.length === 1) {
          message = '「' + member.name + '」是当前换水人。移出后名单将为空，当前换水人也会清空，历史记录会保留。';
        } else if (isCurrent) {
          message = '「' + member.name + '」是当前换水人。移出后，会自动由下一位室友接替，历史记录会保留。';
        } else {
          message = '确定将「' + member.name + '」从名单中移除吗？历史记录会保留。';
        }

        openConfirm('移出换水名单？', message, '移出', function () {
          deleteMember(id);
        });
      }

      function deleteMember(id) {
        ensureCurrent();
        var index = state.members.findIndex(function (member) {
          return member.id === id;
        });
        if (index === -1) return;

        var removed = state.members[index];
        var wasCurrent = state.currentMemberId === id;
        state.members.splice(index, 1);

        var handoff = null;
        if (!state.members.length) {
          state.currentMemberId = null;
        } else if (wasCurrent) {
          var nextIndex = index % state.members.length;
          handoff = state.members[nextIndex];
          state.currentMemberId = handoff.id;
        } else if (!state.members.some(function (member) { return member.id === state.currentMemberId; })) {
          state.currentMemberId = state.members[0].id;
        }

        cleanupLastAction();
        saveState();
        render();
        if (handoff) {
          toast(removed.name + ' 已移出，当前由 ' + handoff.name + ' 接替');
        } else {
          toast(removed.name + ' 已移出换水名单');
        }
      }

      function handleComplete() {
        if (Date.now() < actionLockUntil) {
          toast('操作太快，请稍候');
          return;
        }
        ensureCurrent();
        var member = currentMember();
        if (!member) {
          toast('请先添加室友');
          return;
        }
        var next = nextMemberFor(member);
        if (!next) return;

        var now = new Date();
        var today = todayKey();
        var previousWaterDate = state.lastWaterDate;
        var record = {
          id: makeId(),
          type: 'done',
          date: today,
          memberId: member.id,
          memberName: member.name,
          reason: '',
          checkedAt: now.toISOString()
        };

        state.history.push(record);
        state.history.sort(sortHistory);
        state.lastWaterDate = today;
        state.currentMemberId = next.id;
        state.lastAction = {
          recordId: record.id,
          type: 'done',
          fromMemberId: member.id,
          toMemberId: next.id,
          previousWaterDate: previousWaterDate,
          createdAt: now.toISOString()
        };
        actionLockUntil = Date.now() + 900;

        saveState();
        render();
        els.waterCard.classList.add('celebrate');
        window.setTimeout(function () {
          els.waterCard.classList.remove('celebrate');
        }, 650);
        toast(member.id === next.id
          ? '换水完成，继续由 ' + member.name + ' 负责'
          : '换水完成，已顺延给 ' + next.name);
      }

      function openSkipDialog() {
        ensureCurrent();
        var member = currentMember();
        if (!member) {
          toast('请先添加室友');
          return;
        }
        if (state.members.length < 2) {
          toast('只有一位室友，无法跳过');
          return;
        }
        var next = nextMemberFor(member);
        if (!next || next.id === member.id) return;

        var message = '「' + member.name + '」本次换水将顺延给「' + next.name + '」，提交后立即生效。';

        if (!els.skipDialog || typeof els.skipDialog.showModal !== 'function') {
          var answer = window.prompt('跳过 / 不在\n\n' + message + '\n\n请填写跳过原因：', '');
          if (answer !== null) performSkip(answer);
          return;
        }

        els.skipText.textContent = message;
        els.skipReason.value = '';
        clearSkipError();
        skipReturnFocus = document.activeElement;
        els.skipDialog.returnValue = '';
        if (els.skipDialog.open) els.skipDialog.close('cancel');
        els.skipDialog.showModal();
        window.setTimeout(function () {
          els.skipReason.focus({ preventScroll: true });
        }, 30);
      }

      function handleSkipSubmit(event) {
        event.preventDefault();
        var reason = truncateReason(normalizeReason(els.skipReason.value));
        if (!reason) {
          showSkipError('请填写跳过原因');
          return;
        }
        if (performSkip(reason)) {
          els.skipDialog.close('confirm');
        }
      }

      function performSkip(rawReason) {
