        ensureCurrent();
        var member = currentMember();
        var reason = truncateReason(normalizeReason(rawReason));
        if (!member) {
          toast('请先添加室友');
          return false;
        }
        if (state.members.length < 2) {
          toast('只有一位室友，无法跳过');
          return false;
        }
        if (!reason) {
          toast('请填写跳过原因');
          return false;
        }
        var next = nextMemberFor(member);
        if (!next || next.id === member.id) return false;

        var now = new Date();
        var record = {
          id: makeId(),
          type: 'skip',
          date: todayKey(),
          memberId: member.id,
          memberName: member.name,
          reason: reason,
          checkedAt: now.toISOString()
        };

        state.history.push(record);
        state.history.sort(sortHistory);
        state.currentMemberId = next.id;
        state.lastAction = {
          recordId: record.id,
          type: 'skip',
          fromMemberId: member.id,
          toMemberId: next.id,
          previousWaterDate: state.lastWaterDate,
          createdAt: now.toISOString()
        };

        saveState();
        render();
        toast('已跳过，当前顺延给 ' + next.name);
        return true;
      }

      function showSkipError(message) {
        els.skipError.textContent = message;
        els.skipError.hidden = false;
        els.skipReason.setAttribute('aria-invalid', 'true');
        els.skipReason.focus({ preventScroll: true });
      }

      function clearSkipError() {
        if (els.skipError.hidden) return;
        els.skipError.textContent = '';
        els.skipError.hidden = true;
        els.skipReason.removeAttribute('aria-invalid');
      }

      function undoLastAction() {
        var active = getActiveAction();
        if (!active) {
          toast('这次操作已无法撤销');
          return false;
        }

        state.history = state.history.filter(function (record) {
          return record.id !== active.record.id;
        });
        state.currentMemberId = active.from.id;
        if (active.action.type === 'done') {
          state.lastWaterDate = normalizeDateKey(active.action.previousWaterDate) || null;
        }
        state.lastAction = null;
        saveState();
        render();
        toast(active.action.type === 'done'
          ? '已撤销换水，恢复 ' + active.from.name + ' 为当前换水人'
          : '已撤销跳过，恢复 ' + active.from.name + ' 为当前换水人');
        return true;
      }

      function requestDeleteHistory(id) {
        var record = state.history.find(function (item) {
          return item.id === id;
        });
        if (!record) return;

        var active = getActiveAction();
        var isActive = Boolean(active && active.record.id === id);
        var isSkip = record.type === 'skip';
        var title = isActive
          ? (isSkip ? '撤销这次跳过？' : '撤销这次换水？')
          : '删除这条记录？';
        var message;
        if (isActive) {
          message = isSkip
            ? '将撤销「' + record.memberName + '」的跳过记录，恢复 TA 为当前换水人，并重新允许接着完成换水。'
            : '将撤销「' + record.memberName + '」的换水记录，恢复 TA 为当前换水人，并把饮水天数恢复到这次换水之前。';
        } else if (isSkip) {
          message = '将删除「' + record.memberName + '」在 ' + formatMonthDay(record.date) + ' 的跳过记录，跳过次数会同步更新。当前换水人不会改变。';
        } else {
          message = '将删除「' + record.memberName + '」在 ' + formatMonthDay(record.date) + ' 的换水记录，正常换水次数会同步更新。当前换水人和饮水天数不会改变。';
        }

        openConfirm(title, message, isActive ? '撤销' : '删除', function () {
          if (isActive) {
            undoLastAction();
            return;
          }
          state.history = state.history.filter(function (item) {
            return item.id !== id;
          });
          saveState();
          render();
          toast('记录已删除');
        });
      }

      function requestClearHistory() {
        if (!state.history.length) return;
        openConfirm(
          '清空换水记录？',
          '将删除全部 ' + state.history.length + ' 条换水/跳过记录，并清空饮水天数计时。当前换水人不会改变，此操作无法撤销。',
          '清空',
          function () {
            state.history = [];
            state.lastAction = null;
            state.lastWaterDate = null;
            saveState();
            render();
            toast('换水记录已清空');
          }
        );
      }

      function requestResetAll() {
        openConfirm(
          '重置所有数据？',
          '将清空 ' + state.members.length + ' 位室友、' + state.history.length + ' 条换水记录、饮水天数和当前轮换状态，恢复到初始界面。此操作无法撤销。',
          '重置',
          resetAllData
        );
      }

      function resetAllData() {
        var theme = state.settings.theme;
        state = createEmptyState();
        state.settings.theme = theme;
        els.nameInput.value = '';
        clearNameError();
        if (els.skipDialog && els.skipDialog.open) els.skipDialog.close('cancel');
        actionLockUntil = 0;
        saveState();
        render();
        toast('已重置所有数据');
      }

      function openConfirm(title, message, confirmLabel, onConfirm) {
        if (!els.dialog || typeof els.dialog.showModal !== 'function') {
          if (window.confirm(title + '\n\n' + message)) onConfirm();
          return;
        }

        if (els.dialog.open) els.dialog.close('cancel');
        els.dialogTitle.textContent = title;
        els.dialogText.textContent = message;
        els.dialogConfirm.textContent = confirmLabel;
        pendingConfirm = onConfirm;
        dialogReturnFocus = document.activeElement;
        els.dialog.returnValue = '';
        els.dialog.showModal();
      }

      function cycleTheme() {
        var index = THEME_ORDER.indexOf(state.settings.theme);
        state.settings.theme = THEME_ORDER[(index + 1) % THEME_ORDER.length];
        applyTheme();
        saveState();
      }

      function applyTheme() {
        var theme = state.settings.theme;
        if (theme === 'auto') {
          document.documentElement.setAttribute('data-theme', darkQuery.matches ? 'dark' : 'light');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }

        var labels = { auto: '自动', dark: '深色', light: '浅色' };
        var names = { auto: '跟随系统', dark: '深色', light: '浅色' };
        els.themeLabel.textContent = labels[theme];
        els.themeIcon.innerHTML = ICONS[theme];
        els.themeToggle.setAttribute('aria-label', '当前主题：' + names[theme] + '。点击切换主题');
        els.themeToggle.title = '当前主题：' + names[theme] + '（点击切换）';

        var effective = theme === 'auto' ? (darkQuery.matches ? 'dark' : 'light') : theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', effective === 'dark' ? '#071019' : '#edf4f8');
      }

      function checkDayChange() {
        var now = todayKey();
        if (now === lastDay) return;
        lastDay = now;
        render();
      }

      function toast(message) {
        window.clearTimeout(toastTimer);
        els.toast.textContent = message;
        els.toast.classList.add('show');
        toastTimer = window.setTimeout(function () {
          els.toast.classList.remove('show');
        }, 3000);
      }
    }());
  </script>
</body>
</html>
