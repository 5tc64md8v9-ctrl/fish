<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f0e9">
  <meta name="description" content="宿舍值日小工具：添加室友、自动轮换、每日打卡并保存在本机。">
  <title>宿舍值日 · 今天轮到谁</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f08a4b'/%3E%3Cpath d='M19 33.5l11.5 11.5M41 19L28.5 31.5M27.5 30.5c-2.3-2.3-6-2.3-8.3 0l-2.7 2.7 8.3 8.3 2.7-2.7c2.3-2.3 2.3-6 0-8.3Z' fill='none' stroke='%232b1608' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('dorm-duty:v1');
        var saved = raw ? JSON.parse(raw) : null;
        var theme = saved && saved.settings && saved.settings.theme;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0b1015' : '#f3f0e9');
      } catch (error) {}
    }());
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f0e9;
      --glow-a: rgba(255, 167, 101, 0.24);
      --glow-b: rgba(111, 174, 224, 0.13);
      --surface: rgba(255, 253, 248, 0.78);
      --surface-solid: #fffdf8;
      --row: rgba(255, 255, 255, 0.52);
      --inset: rgba(45, 40, 32, 0.045);
      --input-bg: rgba(255, 255, 255, 0.86);
      --border: rgba(39, 37, 33, 0.10);
      --border-strong: rgba(39, 37, 33, 0.16);
      --text: #1e2430;
      --text-soft: #4f5967;
      --text-muted: #626a77;
      --accent: #f08a4b;
      --accent-strong: #9c4516;
      --accent-grad-a: #f4a065;
      --accent-grad-b: #e77736;
      --accent-soft: rgba(240, 138, 75, 0.14);
      --accent-border: rgba(201, 101, 39, 0.24);
      --accent-contrast: #2b1608;
      --success: #157347;
      --success-soft: rgba(21, 115, 71, 0.11);
      --success-border: rgba(21, 115, 71, 0.22);
      --danger: #b83232;
      --danger-soft: rgba(184, 50, 50, 0.09);
      --danger-border: rgba(184, 50, 50, 0.22);
      --toast-bg: #20252c;
      --toast-text: #fff8ef;
      --shadow: 0 26px 60px -34px rgba(58, 44, 29, 0.38), 0 2px 6px rgba(58, 44, 29, 0.04);
      --shadow-soft: 0 18px 44px -34px rgba(58, 44, 29, 0.30);
      --focus: rgba(240, 138, 75, 0.30);
      --hero-a: rgba(255, 177, 108, 0.26);
      --hero-b: rgba(255, 255, 255, 0.14);
      --scrollbar: rgba(79, 89, 103, 0.28);
      --overlay: rgba(15, 20, 26, 0.46);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --bg: #0b1015;
        --glow-a: rgba(255, 143, 73, 0.13);
        --glow-b: rgba(63, 143, 196, 0.10);
        --surface: rgba(21, 29, 38, 0.76);
        --surface-solid: #141c24;
        --row: rgba(255, 255, 255, 0.035);
        --inset: rgba(255, 255, 255, 0.045);
        --input-bg: rgba(7, 12, 17, 0.48);
        --border: rgba(255, 255, 255, 0.075);
        --border-strong: rgba(255, 255, 255, 0.13);
        --text: #edf2f6;
        --text-soft: #b1bcc9;
        --text-muted: #8d99a9;
        --accent: #ff9b5c;
        --accent-strong: #ffc092;
        --accent-grad-a: #ffb176;
        --accent-grad-b: #ff9b5c;
        --accent-soft: rgba(255, 155, 92, 0.13);
        --accent-border: rgba(255, 155, 92, 0.23);
        --accent-contrast: #2b1608;
        --success: #5cdb95;
        --success-soft: rgba(92, 219, 149, 0.10);
        --success-border: rgba(92, 219, 149, 0.22);
        --danger: #ff8585;
        --danger-soft: rgba(255, 133, 133, 0.10);
        --danger-border: rgba(255, 133, 133, 0.22);
        --toast-bg: #eef3f8;
        --toast-text: #111820;
        --shadow: 0 30px 70px -36px rgba(0, 0, 0, 0.75), 0 2px 8px rgba(0, 0, 0, 0.18);
        --shadow-soft: 0 18px 46px -32px rgba(0, 0, 0, 0.7);
        --focus: rgba(255, 155, 92, 0.34);
        --hero-a: rgba(255, 143, 73, 0.16);
        --hero-b: rgba(255, 255, 255, 0.035);
        --scrollbar: rgba(177, 188, 201, 0.25);
        --overlay: rgba(0, 0, 0, 0.58);
      }
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1015;
      --glow-a: rgba(255, 143, 73, 0.13);
      --glow-b: rgba(63, 143, 196, 0.10);
      --surface: rgba(21, 29, 38, 0.76);
      --surface-solid: #141c24;
      --row: rgba(255, 255, 255, 0.035);
      --inset: rgba(255, 255, 255, 0.045);
      --input-bg: rgba(7, 12, 17, 0.48);
      --border: rgba(255, 255, 255, 0.075);
      --border-strong: rgba(255, 255, 255, 0.13);
      --text: #edf2f6;
      --text-soft: #b1bcc9;
      --text-muted: #8d99a9;
      --accent: #ff9b5c;
      --accent-strong: #ffc092;
      --accent-grad-a: #ffb176;
      --accent-grad-b: #ff9b5c;
      --accent-soft: rgba(255, 155, 92, 0.13);
      --accent-border: rgba(255, 155, 92, 0.23);
      --accent-contrast: #2b1608;
      --success: #5cdb95;
      --success-soft: rgba(92, 219, 149, 0.10);
      --success-border: rgba(92, 219, 149, 0.22);
      --danger: #ff8585;
      --danger-soft: rgba(255, 133, 133, 0.10);
      --danger-border: rgba(255, 133, 133, 0.22);
      --toast-bg: #eef3f8;
      --toast-text: #111820;
      --shadow: 0 30px 70px -36px rgba(0, 0, 0, 0.75), 0 2px 8px rgba(0, 0, 0, 0.18);
      --shadow-soft: 0 18px 46px -32px rgba(0, 0, 0, 0.7);
      --focus: rgba(255, 155, 92, 0.34);
      --hero-a: rgba(255, 143, 73, 0.16);
      --hero-b: rgba(255, 255, 255, 0.035);
      --scrollbar: rgba(177, 188, 201, 0.25);
      --overlay: rgba(0, 0, 0, 0.58);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      background:
        radial-gradient(900px 620px at 84% -8%, var(--glow-a), transparent 66%),
        radial-gradient(720px 520px at -12% 34%, var(--glow-b), transparent 70%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 0 42%, rgba(255, 255, 255, 0.025) 42% 42.3%, transparent 42.3% 100%);
      opacity: 0.7;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    button,
    a {
      touch-action: manipulation;
    }

    ::selection {
      background: var(--accent-soft);
      color: var(--text);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding:
        max(20px, env(safe-area-inset-top))
        clamp(16px, 4.5vw, 28px)
        calc(36px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
      animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 14px;
      color: var(--accent-contrast);
      background: linear-gradient(145deg, var(--accent-grad-a), var(--accent-grad-b));
      box-shadow: 0 10px 24px -14px var(--accent);
    }

    .brand-mark svg {
      width: 23px;
      height: 23px;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy h1 {
      margin: 2px 0 0;
      font-size: 19px;
      line-height: 1.2;
      letter-spacing: -0.025em;
      font-weight: 750;
    }

    .eyebrow {
      margin: 0;
      font-size: 8.5px;
      line-height: 1.2;
      letter-spacing: 0.18em;
      font-weight: 700;
      color: var(--text-muted);
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      flex: 0 0 auto;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }

    .theme-toggle:hover {
      background: var(--surface-solid);
      border-color: var(--border-strong);
      color: var(--text);
    }

    .theme-toggle:active {
      transform: scale(0.97);
    }

    .theme-toggle svg {
      width: 15px;
      height: 15px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(20px, 5vw, 28px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(155deg, var(--surface-solid) 0%, var(--surface) 58%, var(--surface) 100%);
      box-shadow: var(--shadow);
      animation: rise 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) 0.04s both;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      top: -150px;
      right: -125px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--hero-a), transparent 68%);
      pointer-events: none;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, var(--hero-b), transparent 42%);
      pointer-events: none;
    }

    .hero > * {
      position: relative;
      z-index: 1;
    }

    .hero.is-done {
      border-color: var(--success-border);
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--text-muted);
      font-size: 10.5px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
      animation: pulse 2.6s ease-in-out infinite;
    }

    .hero.is-done .live-dot {
      background: var(--success);
      box-shadow: 0 0 0 4px var(--success-soft);
    }

    .date-chip {
      flex: 0 0 auto;
      padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--inset);
      color: var(--text-soft);
      font-size: 10.5px;
      line-height: 1.2;
      font-weight: 550;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .hero-empty {
      text-align: center;
      padding: 18px 0 2px;
    }

    .empty-art {
      width: 112px;
      height: 112px;
      margin: 0 auto 15px;
      display: block;
    }

    .hero-empty h2 {
      margin: 0 0 7px;
      font-size: clamp(22px, 6vw, 27px);
      line-height: 1.25;
      letter-spacing: -0.035em;
      font-weight: 750;
    }

    .hero-empty p {
      max-width: 310px;
      margin: 0 auto;
      color: var(--text-muted);
      font-size: 12.5px;
      line-height: 1.75;
    }

    .hero-empty .btn {
      max-width: 230px;
      margin: 18px auto 0;
    }

    .duty-main {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 20px 0 18px;
      min-width: 0;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      border: 1px solid var(--accent-border);
      border-radius: 22px;
      background: linear-gradient(145deg, var(--accent-soft), var(--surface));
      color: var(--accent-strong);
      font-size: 30px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: -0.04em;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    .hero.is-done .avatar {
      border-color: var(--success-border);
      background: var(--success-soft);
      color: var(--success);
    }

    .hero.celebrate .avatar {
      animation: pop 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .duty-copy {
      min-width: 0;
    }

    .duty-name {
      margin: 0;
      font-size: clamp(2.05rem, 9.2vw, 2.9rem);
      line-height: 1.06;
      font-weight: 780;
      letter-spacing: -0.045em;
      overflow-wrap: anywhere;
    }

    .status-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px 9px;
      margin-top: 9px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 23px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .status-pill.pending {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .status-pill.done {
      background: var(--success-soft);
      color: var(--success);
    }

    .duty-note {
      color: var(--text-muted);
      font-size: 10.5px;
      line-height: 1.4;
    }

    .skip-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 30px;
      padding: 0 9px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-soft);
      font: inherit;
      font-size: 10px;
      line-height: 1;
      font-weight: 650;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color 0.18s ease, color 0.18s ease, background-color 0.18s ease;
    }

    .skip-btn::after {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 999px;
    }

    .skip-btn svg {
      width: 13px;
      height: 13px;
      flex: 0 0 13px;
    }

    .skip-btn:hover:not(:disabled) {
      border-color: var(--accent-border);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .skip-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .skip-notice {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      padding: 9px 9px 9px 11px;
      border: 1px solid var(--accent-border);
      border-radius: 15px;
      background: var(--accent-soft);
    }

    .skip-notice-icon {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      border-radius: 10px;
      background: var(--surface-solid);
      color: var(--accent-strong);
    }

    .skip-notice-icon svg {
      width: 15px;
      height: 15px;
    }

    .skip-notice-copy {
      flex: 1;
      min-width: 0;
    }

    .skip-notice-copy strong {
      display: block;
      color: var(--text);
      font-size: 11.5px;
      line-height: 1.45;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .skip-notice-copy span {
      display: block;
      margin-top: 2px;
      color: var(--text-soft);
      font-size: 10px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .skip-undo {
      min-height: 36px;
      flex: 0 0 auto;
      margin-left: auto;
      padding: 0 10px;
      border: 1px solid var(--accent-border);
      border-radius: 10px;
      background: var(--surface-solid);
      color: var(--accent-strong);
      font: inherit;
      font-size: 10.5px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.18s ease, border-color 0.18s ease;
    }

    .skip-undo:hover {
      background: var(--surface);
      border-color: var(--accent);
    }

    .duty-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--border);
    }

    .meta-cell {
      min-width: 0;
      padding: 12px 14px 13px;
      background: var(--inset);
    }

    .meta-label {
      display: block;
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: 9.5px;
      line-height: 1.3;
      font-weight: 650;
      letter-spacing: 0.06em;
    }

    .meta-value {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta-sub {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 15px;
      cursor: pointer;
      font: inherit;
      text-align: center;
      transition: filter 0.18s ease, transform 0.15s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .btn:active {
      transform: scale(0.985);
    }

    .btn svg {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
    }

    .btn-primary {
      width: 100%;
      min-height: 54px;
      padding: 0 18px;
      background: linear-gradient(135deg, var(--accent-grad-a), var(--accent-grad-b));
      color: var(--accent-contrast);
      font-size: 14.5px;
      font-weight: 750;
      letter-spacing: 0.01em;
      box-shadow: 0 12px 26px -15px var(--accent);
    }

    .btn-primary:hover {
      filter: brightness(1.035) saturate(1.04);
    }

    .done-panel {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 56px;
      padding: 9px 8px 9px 13px;
      border: 1px solid var(--success-border);
      border-radius: 16px;
      background: var(--success-soft);
    }

    .done-check {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 50%;
      background: var(--success);
      color: #fff;
    }

    html[data-theme="dark"] .done-check,
    .hero.is-done .done-check {
      color: #082317;
    }

    .done-check svg {
      width: 18px;
      height: 18px;
    }

    .done-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .done-copy strong {
      color: var(--success);
      font-size: 12.5px;
      line-height: 1.3;
      font-weight: 750;
    }

    .done-copy span {
      color: var(--text-muted);
      font-size: 10.5px;
      line-height: 1.3;
    }

    .undo-btn {
      min-height: 38px;
      margin-left: auto;
      padding: 0 11px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--success);
      font: inherit;
      font-size: 11px;
      font-weight: 650;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .undo-btn:hover {
      background: var(--success-soft);
    }

    .card {
      margin-top: 16px;
      padding: clamp(18px, 4.5vw, 22px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: rise 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s both;
    }

    .card + .card {
      animation-delay: 0.16s;

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-head h2 {
      margin: 0 0 3px;
      font-size: 14.5px;
      line-height: 1.35;
      font-weight: 720;
      letter-spacing: -0.015em;
    }

    .section-head p {
      margin: 0;
      color: var(--text-muted);
      font-size: 10.5px;
      line-height: 1.55;
    }

    .count-badge {
      flex: 0 0 auto;
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--inset);
      color: var(--text-soft);
      font-size: 10px;
      line-height: 1.2;
      font-weight: 600;
      white-space: nowrap;
    }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .member-row {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 56px;
      padding: 8px 9px 8px 8px;
      border: 1px solid transparent;
      border-radius: 15px;
      background: var(--row);
      transition: background-color 0.2s ease, border-color 0.2s ease;
      animation: rowIn 0.3s ease both;
    }

    .member-row.is-current {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .member-order {
      width: 21px;
      flex: 0 0 21px;
      color: var(--text-muted);
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .member-avatar {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--inset);
      color: var(--text-soft);
      font-size: 15px;
      line-height: 1;
      font-weight: 700;
    }

    .member-row.is-current .member-avatar {
      border-color: var(--accent-border);
      background: var(--surface-solid);
      color: var(--accent-strong);
    }

    .member-row.is-current .member-order {
      color: var(--accent-strong);
    }

    .member-main {
      flex: 1;
      min-width: 0;
    }

    .member-name-line {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .member-name {
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.4;
      font-weight: 620;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tag {
      flex: 0 0 auto;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 9px;
      line-height: 1.15;
      font-weight: 750;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .tag-current {
      background: var(--accent);
      color: var(--accent-contrast);
    }

    .tag-next {
      border: 1px solid var(--border);
      background: var(--inset);
      color: var(--text-muted);
    }

    .member-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 1px 9px;
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .member-stat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .stat-dot {
      width: 4px;
      height: 4px;
      flex: 0 0 4px;
      border-radius: 50%;
    }

    .stat-dot.normal {
      background: var(--success);
    }

    .stat-dot.leave {
      background: var(--accent);
    }

    .member-stat strong {
      color: var(--text-soft);
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .member-row.is-current .member-stats {
      color: var(--text-soft);
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      padding: 0;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.18s ease, background-color 0.18s ease;
    }

    .icon-btn:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .icon-btn svg {
      width: 17px;
      height: 17px;
    }

    .mini-empty {
      margin: 0;
      padding: 22px 14px;
      border: 1px dashed var(--border-strong);
      border-radius: 15px;
      background: var(--inset);
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.7;
      text-align: center;
    }

    .add-form {
      display: flex;
      align-items: stretch;
      gap: 8px;
      margin-top: 13px;
    }

    .add-input {
      width: 100%;
      min-width: 0;
      height: 48px;
      padding: 0 13px;
      border: 1px solid var(--border-strong);
      border-radius: 13px;
      outline: none;
      background: var(--input-bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.2;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .add-input::placeholder {
      color: var(--text-muted);
      opacity: 0.9;
    }

    .add-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--focus);
    }

    .add-input[aria-invalid="true"] {
      border-color: var(--danger);
      box-shadow: 0 0 0 4px var(--danger-soft);
    }

    .btn-add {
      flex: 0 0 auto;
      min-width: 86px;
      height: 48px;
      padding: 0 14px;
      border-radius: 13px;
      background: var(--text);
      color: var(--bg);
      font-size: 12.5px;
      font-weight: 700;
    }

    .btn-add:hover {
      filter: brightness(1.08);
    }

    .btn-add svg {
      width: 16px;
      height: 16px;
    }

    .form-error {
      margin: 8px 2px 0;
      color: var(--danger);
      font-size: 11px;
      line-height: 1.55;
    }

    .clear-btn {
      min-height: 36px;
      flex: 0 0 auto;
      padding: 0 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .clear-btn:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .history-list {
      max-height: 390px;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      list-style: none;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar) transparent;
    }

    .history-list::-webkit-scrollbar {
      width: 5px;
    }

    .history-list::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: var(--scrollbar);
    }

    .history-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 2px;
      border-bottom: 1px solid var(--border);
    }

    .history-item:first-child {
      animation: historyIn 0.32s ease both;
    }

    .history-item:last-child {
      border-bottom: 0;
    }

    .history-check {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      margin-top: 1px;
      border-radius: 50%;
      background: var(--success-soft);
      color: var(--success);
    }

    .history-item.is-skip .history-check {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .history-check svg {
      width: 15px;
      height: 15px;
    }

    .history-main {
      flex: 1;
      min-width: 0;
    }

    .history-name {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 12.5px;
      line-height: 1.45;
      font-weight: 620;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-today {
      flex: 0 0 auto;
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 8.5px;
      line-height: 1.25;
      font-weight: 750;
    }

    .history-leave {
      flex: 0 0 auto;
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--accent);
      color: var(--accent-contrast);
      font-size: 8.5px;
      line-height: 1.25;
      font-weight: 750;
    }

    .history-date {
      margin-top: 2px;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-reason {
      margin-top: 3px;
      color: var(--text-soft);
      font-size: 10px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .history-side {
      display: flex;
      align-items: center;
      gap: 3px;
      flex: 0 0 auto;
      margin-top: 1px;
    }

    .history-time {
      flex: 0 0 auto;
      color: var(--text-soft);
      font-size: 10.5px;
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .history-action {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.18s ease, background-color 0.18s ease;
    }

    .history-action:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .history-action.is-undo:hover {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .history-action svg {
      width: 14px;
      height: 14px;
    }

    .history-empty {
      padding: 26px 12px 22px;
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.75;
      text-align: center;
    }

    .history-empty svg {
      display: block;
      width: 24px;
      height: 24px;
      margin: 0 auto 8px;
      color: var(--text-muted);
      opacity: 0.65;
    }

    .storage-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin: 20px 0 0;
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1.5;
      text-align: center;
      animation: rise 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s both;
    }

    .storage-note svg {
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      opacity: 0.8;
    }

    .storage-note.warn {
      color: var(--danger);
    }

    .reset-wrap {
      display: flex;
      justify-content: center;
      margin-top: 8px;
      animation: rise 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) 0.22s both;
    }

    .reset-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 36px;
      padding: 0 11px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: 10.5px;
      line-height: 1;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .reset-btn:hover {
      border-color: var(--danger-border);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .reset-btn svg {
      width: 13px;
      height: 13px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      z-index: 100;
      max-width: calc(100vw - 32px);
      padding: 11px 15px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 13px;
      background: var(--toast-bg);
      color: var(--toast-text);
      box-shadow: 0 16px 38px -13px rgba(0, 0, 0, 0.55);
      font-size: 12px;
      line-height: 1.5;
      font-weight: 550;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 14px);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    dialog.confirm-dialog {
      width: min(calc(100vw - 40px), 360px);
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      padding: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      border: 1px solid var(--border);
      border-radius: 23px;
      background: var(--surface-solid);
      color: var(--text);
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.5);
    }

    dialog.confirm-dialog::backdrop {
      background: var(--overlay);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .dialog-body {
      padding: 23px 22px 17px;
      text-align: center;
    }

    .dialog-icon {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      margin: 0 auto 13px;
      border-radius: 16px;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .dialog-icon svg {
      width: 23px;
      height: 23px;
    }

    .dialog-title {
      margin: 0 0 7px;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .dialog-text {
      margin: 0;
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.7;
    }

    .dialog-actions {
      display: flex;
      gap: 9px;
      padding: 0 18px 18px;
    }

    .dialog-actions .btn {
      flex: 1;
      min-height: 46px;
      border-radius: 13px;
      font-size: 12.5px;
      font-weight: 650;
    }

    .btn-cancel {
      border: 1px solid var(--border);
      background: var(--inset);
      color: var(--text-soft);
    }

    .btn-cancel:hover {
      background: var(--row);
      color: var(--text);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    dialog.leave-dialog {
      width: min(calc(100vw - 32px), 400px);
    }

    .leave-dialog .dialog-body {
      padding-bottom: 13px;
    }

    .leave-icon {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .leave-label {
      display: block;
      margin: 16px 0 6px;
      color: var(--text-soft);
      font-size: 10.5px;
      line-height: 1.4;
      font-weight: 700;
      text-align: left;
    }

    .leave-input {
      width: 100%;
      height: 48px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      outline: none;
      background: var(--input-bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.2;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .leave-input::placeholder {
      color: var(--text-muted);
      opacity: 0.9;
    }

    .leave-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--focus);
    }

    .leave-input[aria-invalid="true"] {
      border-color: var(--danger);
      box-shadow: 0 0 0 4px var(--danger-soft);
    }

    .leave-error {
      margin-top: 7px;
      text-align: left;
    }

    .btn-leave {
      background: linear-gradient(135deg, var(--accent-grad-a), var(--accent-grad-b));
      color: var(--accent-contrast);
    }

    .btn-leave:hover {
      filter: brightness(1.035) saturate(1.04);
    }

    html[data-theme="dark"] .btn-danger {
      color: #2a0b0b;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .btn-danger {
        color: #2a0b0b;
      }

      :root:not([data-theme]) .done-check {
        color: #082317;
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes rowIn {
      from {
        opacity: 0;
        transform: translateY(3px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes historyIn {
      from {
        opacity: 0;
        transform: translateY(-3px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(0.82);
        opacity: 0.72;
      }
    }

    @keyframes pop {
      0% {
        transform: scale(1) rotate(0);
      }
      34% {
        transform: scale(1.09) rotate(-3deg);
      }
      68% {
        transform: scale(0.98) rotate(1deg);
      }
      100% {
        transform: scale(1) rotate(0);
      }
    }

    @media (max-width: 390px) {
      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      .hero {
        border-radius: 24px;
      }

      .avatar {
        width: 64px;
        height: 64px;
        flex-basis: 64px;
        border-radius: 20px;
        font-size: 27px;
      }

      .duty-main {
        gap: 13px;
        margin: 18px 0 16px;
      }

      .duty-meta {
        border-radius: 16px;
      }

      .meta-cell {
        padding: 11px 12px 12px;
      }

      .btn-add {
        min-width: 78px;
        padding: 0 11px;
      }

      .btn-add svg {
        width: 15px;
        height: 15px;
      }

      .theme-toggle {
        padding: 0 9px;
      }
    }

    @media (max-width: 340px) {
      .brand-mark {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
        border-radius: 13px;
      }

      .brand-copy h1 {
        font-size: 17px;
      }

      .eyebrow {
        display: none;
      }

      .theme-toggle {
        gap: 4px;
        font-size: 10px;
      }

      .date-chip {
        font-size: 9.5px;
        padding: 5px 7px;
      }

      .kicker {
        font-size: 9.5px;
        gap: 7px;
      }

      .meta-value {
        font-size: 12.5px;
      }

      .btn-add {
        min-width: 48px;
        padding: 0 10px;
      }

      .btn-add span {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19.5 4.5 11.6 12.4"></path>
            <path d="M11.1 11.1c-1.2-1.2-3.2-1.2-4.4 0l-2.7 2.7 5.9 5.9 2.7-2.7c1.2-1.2 1.2-3.2 0-4.4Z"></path>
            <path d="m5.5 15.6-1.2 1.2M7.9 18l-1.2 1.2M10.3 20.4l-1.2 1.2"></path>
          </svg>

        <div class="brand-copy">

          <h1>宿舍值日</h1>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题">
        <span id="themeIcon" aria-hidden="true"></span>
        <span id="themeLabel">自动</span>
      </button>
    </header>

    <main>
      <section class="hero" id="dutyCard" aria-label="今日值日">

          <p class="kicker"><span class="live-dot" aria-hidden="true"></span>今日值日</p>
          <span class="date-chip" id="todayDate"></span>
        </div>

        <div class="hero-empty" id="heroEmpty" hidden>
          <svg class="empty-art" viewBox="0 0 120 120" fill="none" aria-hidden="true">
            <circle cx="60" cy="58" r="47" fill="var(--accent-soft)"></circle>
