  <script>
    (function () {
      'use strict';

      var STORAGE_KEY = 'dorm-duty:v1';
      var STATE_VERSION = 2;
      var MAX_NAME_LENGTH = 16;
      var MAX_REASON_LENGTH = 40;
      var THEME_ORDER = ['auto', 'dark', 'light'];
      var WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      var darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

      var ICONS = {
        auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4v16" stroke-linecap="round"></path><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"></path></svg>',
        dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 14.4A8.5 8.5 0 0 1 9.6 3.8 8.5 8.5 0 1 0 20.2 14.4Z"></path></svg>',
        light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.8v2M12 19.2v2M21.2 12h-2M4.8 12h-2M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4M18.5 18.5l-1.4-1.4M6.9 6.9 5.5 5.5"></path></svg>',
        trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9.5 7V5.4c0-.8.6-1.4 1.4-1.4h2.2c.8 0 1.4.6 1.4 1.4V7M6.4 7l.8 12c.1 1 .9 1.7 1.9 1.7h5.8c1 0 1.8-.7 1.9-1.7l.8-12"></path><path d="M10 11v5.5M14 11v5.5"></path></svg>',
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.2 4.2L19 7"></path></svg>',
        leave: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"></path><path d="m13 7 5 5-5 5"></path></svg>',
        undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7 4 12l5 5"></path><path d="M4 12h9a6 6 0 0 1 6 6v1"></path></svg>',
        emptyHistory: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12a1.5 1.5 0 0 1 1.5 1.5v15L12 16.5 4.5 20V5A1.5 1.5 0 0 1 6 3.5Z"></path><path d="M8.5 8h7M8.5 11.5h4"></path></svg>'
      };

      var els = {
        dutyCard: document.getElementById('dutyCard'),
        todayDate: document.getElementById('todayDate'),
        heroEmpty: document.getElementById('heroEmpty'),
        heroActive: document.getElementById('heroActive'),
        dutyAvatar: document.getElementById('dutyAvatar'),
        dutyName: document.getElementById('dutyName'),
        statusPill: document.getElementById('statusPill'),
        dutyNote: document.getElementById('dutyNote'),
        skipBtn: document.getElementById('skipBtn'),
        skipNotice: document.getElementById('skipNotice'),
        skipNoticeTitle: document.getElementById('skipNoticeTitle'),
        skipNoticeText: document.getElementById('skipNoticeText'),
        undoSkipBtn: document.getElementById('undoSkipBtn'),
        nextDateValue: document.getElementById('nextDateValue'),
        nextDateSub: document.getElementById('nextDateSub'),
        nextMemberValue: document.getElementById('nextMemberValue'),
        nextMemberSub: document.getElementById('nextMemberSub'),
        checkBtn: document.getElementById('checkBtn'),
        donePanel: document.getElementById('donePanel'),
        doneTime: document.getElementById('doneTime'),
        undoBtn: document.getElementById('undoBtn'),
        memberCount: document.getElementById('memberCount'),
        memberList: document.getElementById('memberList'),
        memberEmpty: document.getElementById('memberEmpty'),
        addForm: document.getElementById('addForm'),
        nameInput: document.getElementById('nameInput'),
        nameError: document.getElementById('nameError'),
        historyHint: document.getElementById('historyHint'),
        historyList: document.getElementById('historyList'),
        clearHistoryBtn: document.getElementById('clearHistoryBtn'),
        resetDataBtn: document.getElementById('resetDataBtn'),
        storageNote: document.getElementById('storageNote'),
        storageText: document.getElementById('storageText'),
        themeToggle: document.getElementById('themeToggle'),
        themeIcon: document.getElementById('themeIcon'),
        themeLabel: document.getElementById('themeLabel'),
        toast: document.getElementById('toast'),
        dialog: document.getElementById('confirmDialog'),
        dialogTitle: document.getElementById('dialogTitle'),
        dialogText: document.getElementById('dialogText'),
        dialogConfirm: document.getElementById('dialogConfirm'),
        leaveDialog: document.getElementById('leaveDialog'),
        leaveForm: document.getElementById('leaveForm'),
        leaveText: document.getElementById('leaveText'),
        leaveReason: document.getElementById('leaveReason'),
        leaveError: document.getElementById('leaveError'),
        leaveCancel: document.getElementById('leaveCancel')
      };

      var storageOK = true;
      var state = loadState();
      var lastDay = todayKey();
      var toastTimer = null;
      var pendingConfirm = null;
      var dialogReturnFocus = null;
      var leaveReturnFocus = null;

      init();

      function init() {
        syncRotation(false);
        saveState();
        bindEvents();
        updateStorageNote();
        applyTheme();
        render();
        lastDay = todayKey();
        window.setInterval(checkDayChange, 20000);
      }

      function bindEvents() {
        els.addForm.addEventListener('submit', handleAddMember);
        els.checkBtn.addEventListener('click', handleCheckIn);
        els.undoBtn.addEventListener('click', handleUndo);
        els.skipBtn.addEventListener('click', openLeaveDialog);
        els.undoSkipBtn.addEventListener('click', function () {
          undoLastSkip();
        });
        els.clearHistoryBtn.addEventListener('click', requestClearHistory);
        els.resetDataBtn.addEventListener('click', requestResetAll);
        els.themeToggle.addEventListener('click', cycleTheme);
        els.nameInput.addEventListener('input', clearNameError);

        els.memberList.addEventListener('click', function (event) {
          var button = event.target.closest('[data-delete-id]');
          if (!button) return;
          requestDeleteMember(button.getAttribute('data-delete-id'));
        });

        els.historyList.addEventListener('click', function (event) {
          var button = event.target.closest('[data-history-id]');
          if (!button) return;
          requestDeleteHistory(button.getAttribute('data-history-id'));
        });

        els.leaveReason.addEventListener('input', clearLeaveError);
        els.leaveForm.addEventListener('submit', handleLeaveSubmit);
        els.leaveCancel.addEventListener('click', function () {
          els.leaveDialog.close('cancel');
        });
        els.leaveDialog.addEventListener('click', function (event) {
          if (event.target === els.leaveDialog) {
            els.leaveDialog.close('cancel');
          }
        });
        els.leaveDialog.addEventListener('close', function () {
          if (leaveReturnFocus && leaveReturnFocus.isConnected && typeof leaveReturnFocus.focus === 'function') {
            leaveReturnFocus.focus({ preventScroll: true });
          }
          leaveReturnFocus = null;
        });

        document.addEventListener('click', function (event) {
          var trigger = event.target.closest('[data-focus-add]');
          if (!trigger) return;
          var behavior = reduceMotion.matches ? 'auto' : 'smooth';
          els.nameInput.focus({ preventScroll: true });
          els.nameInput.scrollIntoView({ behavior: behavior, block: 'center' });
        });

        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) checkDayChange();
        });
        window.addEventListener('focus', checkDayChange);

        if (typeof darkQuery.addEventListener === 'function') {
          darkQuery.addEventListener('change', function () {
            if (state.settings.theme === 'auto') applyTheme();
          });
        } else if (typeof darkQuery.addListener === 'function') {
          darkQuery.addListener(function () {
            if (state.settings.theme === 'auto') applyTheme();
          });
        }

        els.dialog.addEventListener('close', function () {
          var callback = pendingConfirm;
          pendingConfirm = null;
          if (els.dialog.returnValue === 'confirm' && typeof callback === 'function') {
            callback();
          }
          if (dialogReturnFocus && dialogReturnFocus.isConnected && typeof dialogReturnFocus.focus === 'function') {
            dialogReturnFocus.focus({ preventScroll: true });
          }
          dialogReturnFocus = null;
        });

        els.dialog.addEventListener('click', function (event) {
          if (event.target === els.dialog) {
            els.dialog.close('cancel');
          }
        });
      }

      function createEmptyState() {
        return {
          version: STATE_VERSION,
          members: [],
          duty: null,
          history: [],
          lastSkip: null,
          settings: { theme: 'auto' }
        };
      }

      function loadState() {
        var parsed = null;
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) parsed = JSON.parse(raw);
        } catch (error) {
          storageOK = false;
        }

        if (!parsed || typeof parsed !== 'object') return createEmptyState();

        var next = createEmptyState();
        var memberIds = new Set();
        var rawMembers = Array.isArray(parsed.members) ? parsed.members : [];

        rawMembers.forEach(function (item) {
          if (!item || typeof item !== 'object') return;
          var name = normalizeName(item.name);
          if (!name) return;
          var id = typeof item.id === 'string' && item.id.trim() ? item.id.trim() : makeId();
          while (memberIds.has(id)) id = makeId();
          memberIds.add(id);
          next.members.push({
            id: id,
            name: truncateName(name),
            createdAt: validISO(item.createdAt) || new Date().toISOString()
          });
        });

        if (parsed.duty && typeof parsed.duty === 'object') {
          var dutyMemberId = typeof parsed.duty.memberId === 'string' ? parsed.duty.memberId : '';
          var dutyWeek = normalizeDateKey(parsed.duty.weekStart);
          if (dutyWeek) dutyWeek = weekStartKey(keyToDate(dutyWeek));
          if (!dutyWeek && normalizeDateKey(parsed.duty.date)) {
            dutyWeek = currentWeekStart();
          }
          if (dutyWeek && memberIds.has(dutyMemberId)) {
            next.duty = { weekStart: dutyWeek, memberId: dutyMemberId };
          }
        }

        var historyIds = new Set();
        var rawHistory = Array.isArray(parsed.history) ? parsed.history : [];
        rawHistory.forEach(function (item) {
          if (!item || typeof item !== 'object') return;
          var date = normalizeDateKey(item.date);
          var memberName = truncateName(normalizeName(item.memberName));
          if (!date || !memberName) return;
          var id = typeof item.id === 'string' && item.id.trim() ? item.id.trim() : makeId();
          while (historyIds.has(id)) id = makeId();
          historyIds.add(id);
          var checkedAt = validISO(item.checkedAt);
          if (!checkedAt) {
            var fallback = new Date(date + 'T12:00:00');
            checkedAt = isNaN(fallback.getTime()) ? new Date().toISOString() : fallback.toISOString();
          }
          var type = item.type === 'skip' ? 'skip' : 'done';
          next.history.push({
            id: id,
            type: type,
            date: date,
            memberId: typeof item.memberId === 'string' ? item.memberId : '',
            memberName: memberName,
            reason: type === 'skip' ? (truncateReason(normalizeReason(item.reason)) || '未填写原因') : '',
            handoffToId: type === 'skip' && typeof item.handoffToId === 'string' ? item.handoffToId : '',
            handoffToName: type === 'skip' ? truncateName(normalizeName(item.handoffToName)) : '',
            checkedAt: checkedAt
          });
        });

        next.history.sort(sortHistory);

        if (parsed.lastSkip && typeof parsed.lastSkip === 'object') {
          var lastRecordId = typeof parsed.lastSkip.recordId === 'string' ? parsed.lastSkip.recordId : '';
          var fromMemberId = typeof parsed.lastSkip.fromMemberId === 'string' ? parsed.lastSkip.fromMemberId : '';
          var toMemberId = typeof parsed.lastSkip.toMemberId === 'string' ? parsed.lastSkip.toMemberId : '';
          var lastWeek = normalizeDateKey(parsed.lastSkip.weekStart);
          if (lastWeek) lastWeek = weekStartKey(keyToDate(lastWeek));
          var hasRecord = next.history.some(function (record) {
            return record.id === lastRecordId && record.type === 'skip';
          });
          if (lastWeek && lastRecordId && hasRecord && memberIds.has(fromMemberId) && memberIds.has(toMemberId)) {
            next.lastSkip = {
              recordId: lastRecordId,
              fromMemberId: fromMemberId,
              toMemberId: toMemberId,
              weekStart: lastWeek,
              createdAt: validISO(parsed.lastSkip.createdAt) || new Date().toISOString()
            };
          }
        }

        if (parsed.settings && THEME_ORDER.indexOf(parsed.settings.theme) !== -1) {
          next.settings.theme = parsed.settings.theme;
        }
        return next;
      }

      function saveState() {
        if (!storageOK) return false;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          return true;
        } catch (error) {
          storageOK = false;
          updateStorageNote();
          toast('本地存储不可用，数据无法保存');
          return false;
        }
      }

      function updateStorageNote() {
        if (!els.storageNote) return;
        if (storageOK) {
          els.storageText.textContent = '已开启本地保存 · 刷新不丢失';
          els.storageNote.classList.remove('warn');
        } else {
          els.storageText.textContent = '当前浏览器禁用了本地存储，刷新后数据会丢失';
          els.storageNote.classList.add('warn');
        }
      }

      function normalizeName(value) {
        if (typeof value !== 'string') return '';
        return value.trim().replace(/\s+/g, ' ');
      }

      function truncateName(name) {
        return Array.from(name).slice(0, MAX_NAME_LENGTH).join('');
      }

      function normalizeReason(value) {
        if (typeof value !== 'string') return '';
        return value.trim().replace(/\s+/g, ' ');
      }

      function truncateReason(reason) {
        return Array.from(reason).slice(0, MAX_REASON_LENGTH).join('');
      }

      function makeId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
      }

      function pad(value) {
        return String(value).padStart(2, '0');
      }

      function dateKey(date) {
        return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
      }

      function todayKey() {
        return dateKey(new Date());
      }

      function keyToDate(key) {
        var parts = key.split('-').map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0);
      }

      function normalizeDateKey(value) {
        if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
        var parts = value.split('-').map(Number);
        var date = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0);
        if (
          date.getFullYear() !== parts[0] ||
          date.getMonth() !== parts[1] - 1 ||
          date.getDate() !== parts[2]
        ) return null;
        return value;
      }

      function addDaysKey(key, amount) {
        var parts = key.split('-').map(Number);
        return dateKey(new Date(parts[0], parts[1] - 1, parts[2] + amount, 12, 0, 0, 0));
      }

      function daysBetween(fromKey, toKey) {
        var from = fromKey.split('-').map(Number);
        var to = toKey.split('-').map(Number);
        var fromUTC = Date.UTC(from[0], from[1] - 1, from[2]);
        var toUTC = Date.UTC(to[0], to[1] - 1, to[2]);
        return Math.round((toUTC - fromUTC) / 86400000);
      }

      function weekStartKey(date) {
        var base = date ? new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12, 0, 0, 0) : new Date();
        var day = base.getDay();
        var offset = day === 0 ? -6 : 1 - day;
        base.setDate(base.getDate() + offset);
        return dateKey(base);
      }

      function currentWeekStart() {
        return weekStartKey(new Date());
      }

      function nextWeekStart() {
        return addDaysKey(currentWeekStart(), 7);
      }

      function weekdayName(key) {
        return WEEKDAYS[keyToDate(key).getDay()];
      }

      function formatMonthDay(key) {
        var date = keyToDate(key);
        return (date.getMonth() + 1) + '月' + date.getDate() + '日';
      }

      function formatChip(key) {
        return formatMonthDay(key) + ' ' + weekdayName(key);
      }

      function formatFullDate(key) {
        var date = keyToDate(key);
        return date.getFullYear() + '年' + formatMonthDay(key) + ' ' + weekdayName(key);
      }

      function formatHistoryDate(key, today) {
        var date = keyToDate(key);
        var base = formatMonthDay(key) + ' ' + weekdayName(key);
        if (key === today) return '今天 · ' + base;
        if (key === addDaysKey(today, -1)) return '昨天 · ' + base;
        if (date.getFullYear() !== new Date().getFullYear()) return date.getFullYear() + '年' + base;
        return base;
      }

      function formatTime(iso) {
        var date = new Date(iso);
        if (isNaN(date.getTime())) return '--:--';
        return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
      }

      function formatTimestamp(iso) {
        var date = new Date(iso);
        if (isNaN(date.getTime())) return '';
        try {
          return new Intl.DateTimeFormat('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'short',
            hour: '2-digit',
            minute: '2-digit'
          }).format(date);
        } catch (error) {
          return date.toLocaleString('zh-CN');
        }
      }

      function validISO(value) {
        if (typeof value !== 'string' || !value) return null;
        var date = new Date(value);
        return isNaN(date.getTime()) ? null : date.toISOString();
      }

      function sortHistory(a, b) {
        var byTime = String(b.checkedAt).localeCompare(String(a.checkedAt));
        if (byTime !== 0) return byTime;
        return String(b.date).localeCompare(String(a.date));
      }

      function syncRotation(announce) {
        var weekStart = currentWeekStart();
        var members = state.members;

        if (!members.length) {
          if (state.duty !== null || state.lastSkip !== null) {
            state.duty = null;
            state.lastSkip = null;
            return true;
          }
          return false;
        }

        var index = -1;
        if (state.duty && state.duty.memberId) {
          index = members.findIndex(function (member) {
            return member.id === state.duty.memberId;
          });
        }

        if (index === -1 || !state.duty || !normalizeDateKey(state.duty.weekStart)) {
          state.duty = { weekStart: weekStart, memberId: members[0].id };
          state.lastSkip = null;
          return true;
        }

        if (state.duty.weekStart === weekStart) return false;

        var weekDifference = Math.round(daysBetween(state.duty.weekStart, weekStart) / 7);
        if (weekDifference <= 0) {
          state.duty = { weekStart: weekStart, memberId: state.duty.memberId };
          state.lastSkip = null;
          return true;
        }

        var nextIndex = (index + weekDifference) % members.length;
        state.duty = { weekStart: weekStart, memberId: members[nextIndex].id };
        state.lastSkip = null;
        if (announce) toast('新的一周，本周轮到「' + members[nextIndex].name + '」');
        return true;
      }

      function currentIndex() {
        if (!state.duty) return -1;
        return state.members.findIndex(function (member) {
          return member.id === state.duty.memberId;
        });
      }

      function currentMember() {
        var index = currentIndex();
        return index === -1 ? null : state.members[index];
      }

      function nextMemberFor(member) {
        if (!member || state.members.length < 2) return null;
        var index = state.members.findIndex(function (item) {
          return item.id === member.id;
        });
        if (index === -1) return null;
        return state.members[(index + 1) % state.members.length];
      }

      function todayDoneRecordFor(memberId) {
        var today = todayKey();
        return state.history.find(function (record) {
          return record.date === today && record.memberId === memberId && record.type !== 'skip';
        }) || null;
      }

      function getActiveSkip() {
        var skip = state.lastSkip;
        if (!skip || skip.weekStart !== currentWeekStart()) return null;
        if (!state.duty || state.duty.memberId !== skip.toMemberId) return null;
        var record = state.history.find(function (item) {
          return item.id === skip.recordId && item.type === 'skip';
        });
        if (!record) return null;
        var from = state.members.find(function (member) {
          return member.id === skip.fromMemberId;
        });
        var to = state.members.find(function (member) {
          return member.id === skip.toMemberId;
        });
        if (!from || !to) return null;
        return { skip: skip, record: record, from: from, to: to };
      }

      function buildMemberStats() {
        var stats = {};
        state.members.forEach(function (member) {
          stats[member.id] = { normal: 0, leave: 0 };
        });
        state.history.forEach(function (record) {
          if (!stats[record.memberId]) return;
          if (record.type === 'skip') stats[record.memberId].leave += 1;
          else stats[record.memberId].normal += 1;
        });
        return stats;
      }

      function getInitial(name) {
        return Array.from(String(name).trim())[0] || '?';
      }

      function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, function (character) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
          }[character];
        });
      }

      function render() {
        var today = todayKey();
        els.todayDate.textContent = formatChip(today);
        els.todayDate.title = formatFullDate(today);
        els.memberCount.textContent = state.members.length + ' 人';

        if (!state.members.length) {
          els.heroEmpty.hidden = false;
          els.heroActive.hidden = true;
          els.dutyCard.classList.remove('is-done', 'celebrate');
          els.skipNotice.hidden = true;
          els.memberList.hidden = true;
          els.memberList.innerHTML = '';
          els.memberEmpty.hidden = false;
          renderHistory(today);
          return;
        }

        els.heroEmpty.hidden = true;
        els.heroActive.hidden = false;
        els.memberEmpty.hidden = true;
        els.memberList.hidden = false;

        var index = currentIndex();
        if (index === -1) {
          state.duty = { weekStart: currentWeekStart(), memberId: state.members[0].id };
          saveState();
          index = 0;
        }

        var current = state.members[index];
        var next = state.members[(index + 1) % state.members.length];
        var record = todayDoneRecordFor(current.id);
        var nextDate = nextWeekStart();
        var daysToNext = Math.max(1, daysBetween(today, nextDate));
        var activeSkip = getActiveSkip();

        els.dutyName.textContent = current.name;
        els.dutyAvatar.textContent = getInitial(current.name);
        els.nextDateValue.textContent = formatMonthDay(nextDate);
        els.nextDateValue.title = formatFullDate(nextDate);
        els.nextDateSub.textContent = daysToNext === 1 ? '明天 · 周一' : '下周一 · ' + daysToNext + '天后';
        els.nextMemberValue.textContent = next.name;
        els.nextMemberValue.title = next.name;
        els.nextMemberSub.textContent = state.members.length === 1 ? '目前只有 1 人轮值' : '按名单顺序接棒';
        els.checkBtn.setAttribute('aria-label', '打卡完成：' + current.name);
        els.skipBtn.disabled = state.members.length < 2;
        els.skipBtn.title = state.members.length < 2 ? '只有一位室友，无法顺延' : '跳过本周并顺延给下一位';
        els.skipBtn.setAttribute('aria-label', state.members.length < 2 ? '跳过/请假不可用：只有一位室友' : '跳过/请假，将本周任务顺延给 ' + next.name);

        if (activeSkip) {
          els.skipNotice.hidden = false;
          els.skipNoticeTitle.textContent = activeSkip.from.name + ' 已请假，本周由 ' + activeSkip.to.name + ' 接替';
          els.skipNoticeText.textContent = '原因：' + activeSkip.record.reason;
        } else {
          els.skipNotice.hidden = true;
        }

        if (record) {
          els.dutyCard.classList.add('is-done');
          els.statusPill.textContent = '已完成';
          els.statusPill.classList.remove('pending');
          els.statusPill.classList.add('done');
          els.dutyNote.textContent = '辛苦啦，已记录';
          els.checkBtn.hidden = true;
          els.donePanel.hidden = false;
          els.doneTime.textContent = formatTime(record.checkedAt) + ' 打卡完成';
        } else {
          els.dutyCard.classList.remove('is-done');
          els.statusPill.textContent = '待打卡';
          els.statusPill.classList.remove('done');
          els.statusPill.classList.add('pending');
          els.dutyNote.textContent = '每周一 00:00 自动轮换';
          els.checkBtn.hidden = false;
          els.donePanel.hidden = true;
        }

        renderMembers(current.id, next.id);
        renderHistory(today, activeSkip);
      }

      function renderMembers(currentId, nextId) {
        var multiple = state.members.length > 1;
        var stats = buildMemberStats();
        els.memberList.innerHTML = state.members.map(function (member, index) {
          var isCurrent = member.id === currentId;
          var isNext = multiple && member.id === nextId && !isCurrent;
          var memberStats = stats[member.id] || { normal: 0, leave: 0 };
          var tag = '';
          if (isCurrent) tag = '<span class="tag tag-current">本周</span>';
          else if (isNext) tag = '<span class="tag tag-next">下一位</span>';

          return '<li class="member-row' + (isCurrent ? ' is-current' : '') + '"' + (isCurrent ? ' aria-current="true"' : '') + '>' +
            '<span class="member-order" aria-hidden="true">' + pad(index + 1) + '</span>' +
            '<span class="member-avatar" aria-hidden="true">' + escapeHTML(getInitial(member.name)) + '</span>' +
            '<div class="member-main">' +
              '<div class="member-name-line">' +
                '<span class="member-name" title="' + escapeHTML(member.name) + '">' + escapeHTML(member.name) + '</span>' +
                tag +
              '</div>' +
              '<div class="member-stats" title="正常值日 ' + memberStats.normal + ' 次，请假少做 ' + memberStats.leave + ' 次">' +
                '<span class="member-stat"><span class="stat-dot normal" aria-hidden="true"></span>正常值日 <strong>' + memberStats.normal + '</strong> 次</span>' +
                ' ' +
                '<span class="member-stat"><span class="stat-dot leave" aria-hidden="true"></span>请假少做 <strong>' + memberStats.leave + '</strong> 次</span>' +
              '</div>' +
            '</div>' +
            '<button class="icon-btn" type="button" data-delete-id="' + escapeHTML(member.id) + '" aria-label="将 ' + escapeHTML(member.name) + ' 移出值日名单" title="移出名单">' + ICONS.trash + '</button>' +
          '</li>';
        }).join('');
      }

      function renderHistory(today, activeSkip) {
        var records = state.history;
        var doneCount = records.filter(function (record) { return record.type !== 'skip'; }).length;
        var leaveCount = records.filter(function (record) { return record.type === 'skip'; }).length;
        els.historyHint.textContent = records.length
          ? '共 ' + doneCount + ' 次正常 · ' + leaveCount + ' 次请假'
          : '完成第一次打卡或请假后，记录会出现在这里';
        els.clearHistoryBtn.hidden = records.length === 0;

        if (!records.length) {
          els.historyList.innerHTML = '<li class="history-empty">' + ICONS.emptyHistory + '还没有值日记录<br>完成今天的值日后，来打个卡吧。</li>';
          return;
        }

        els.historyList.innerHTML = records.map(function (record) {
          var isSkip = record.type === 'skip';
          var isActiveSkip = Boolean(activeSkip && activeSkip.record.id === record.id);
          var todayTag = record.date === today ? '<span class="history-today">今天</span>' : '';
          var leaveTag = isSkip ? '<span class="history-leave">请假</span>' : '';
          var reason = isSkip
            ? '<div class="history-reason">原因：' + escapeHTML(record.reason) + (record.handoffToName ? ' · 顺延给 ' + escapeHTML(record.handoffToName) : '') + '</div>'
            : '';
          var actionLabel = isActiveSkip ? '撤销这次请假' : '删除这条记录';
          var actionIcon = isActiveSkip ? ICONS.undo : ICONS.trash;

          return '<li class="history-item' + (isSkip ? ' is-skip' : '') + '">' +
            '<span class="history-check" aria-hidden="true">' + (isSkip ? ICONS.leave : ICONS.check) + '</span>' +
            '<div class="history-main">' +
              '<div class="history-name">' + escapeHTML(record.memberName) + leaveTag + todayTag + '</div>' +
              '<div class="history-date">' + escapeHTML(formatHistoryDate(record.date, today)) + '</div>' +
              reason +
            '</div>' +
            '<div class="history-side">' +
              '<time class="history-time" datetime="' + escapeHTML(record.checkedAt) + '" title="' + escapeHTML(formatTimestamp(record.checkedAt)) + '">' + escapeHTML(formatTime(record.checkedAt)) + '</time>' +
              '<button class="history-action' + (isActiveSkip ? ' is-undo' : '') + '" type="button" data-history-id="' + escapeHTML(record.id) + '" aria-label="' + actionLabel + '：' + escapeHTML(record.memberName) + ' ' + escapeHTML(formatMonthDay(record.date)) + '" title="' + actionLabel + '">' + actionIcon + '</button>' +
            '</div>' +
          '</li>';
        }).join('');
      }

      function handleAddMember(event) {
        event.preventDefault();
        var name = normalizeName(els.nameInput.value);

        if (!name) {
          showNameError('请输入室友名字');
          return;
        }
        if (Array.from(name).length > MAX_NAME_LENGTH) {
          showNameError('名字最多 ' + MAX_NAME_LENGTH + ' 个字');
          return;
        }
        var duplicated = state.members.some(function (member) {
          return member.name.toLocaleLowerCase() === name.toLocaleLowerCase();
        });
        if (duplicated) {
          showNameError('名单中已有「' + name + '」');
          return;
        }

        syncRotation(false);
        var member = {
          id: makeId(),
          name: name,
          createdAt: new Date().toISOString()
        };
        state.members.push(member);
        if (!state.duty) {
          state.duty = { weekStart: currentWeekStart(), memberId: member.id };
        }

        clearNameError();
        els.nameInput.value = '';
        saveState();
        render();
        toast(state.members.length === 1
          ? '已添加 ' + member.name + '，从本周开始轮值'
          : member.name + ' 已加入轮值名单');
        els.nameInput.focus({ preventScroll: true });
      }

      function showNameError(message) {
        els.nameError.textContent = message;
        els.nameError.hidden = false;
        els.nameInput.setAttribute('aria-invalid', 'true');
        els.nameInput.focus({ preventScroll: true });
      }

      function clearNameError() {
        if (els.nameError.hidden) return;
        els.nameError.textContent = '';
        els.nameError.hidden = true;
        els.nameInput.removeAttribute('aria-invalid');
      }

      function requestDeleteMember(id) {
        var member = state.members.find(function (item) {
          return item.id === id;
        });
        if (!member) return;

        var isCurrent = state.duty && state.duty.memberId === id;
        var message;
        if (isCurrent && state.members.length === 1) {
          message = '「' + member.name + '」是本周的值日生。移出后名单将为空，本周值日也会清空，历史记录会保留。';
        } else if (isCurrent) {
          message = '「' + member.name + '」是本周的值日生。移出后，将由下一位室友接替本周剩余时间，历史记录会保留。';
        } else {
          message = '确定将「' + member.name + '」从名单中移除吗？历史记录会保留。';
        }

        openConfirm('移出值日名单？', message, '移出', function () {
          deleteMember(id);
        });
      }

      function deleteMember(id) {
        syncRotation(false);
        var index = state.members.findIndex(function (member) {
          return member.id === id;
        });
        if (index === -1) return;

        var removed = state.members[index];
        var wasCurrent = state.duty && state.duty.memberId === id;
        state.members.splice(index, 1);

        var handoff = null;
        if (!state.members.length) {
          state.duty = null;
        } else if (wasCurrent) {
          var nextIndex = index % state.members.length;
          handoff = state.members[nextIndex];
          state.duty = { weekStart: currentWeekStart(), memberId: handoff.id };
        } else if (!state.duty || !state.members.some(function (member) { return member.id === state.duty.memberId; })) {
          state.duty = { weekStart: currentWeekStart(), memberId: state.members[0].id };
        }

        if (state.lastSkip) {
          var skipFromExists = state.members.some(function (member) { return member.id === state.lastSkip.fromMemberId; });
          var skipToExists = state.members.some(function (member) { return member.id === state.lastSkip.toMemberId; });
          var skipRecordExists = state.history.some(function (record) { return record.id === state.lastSkip.recordId; });
          if (!skipFromExists || !skipToExists || !skipRecordExists || !state.duty || state.duty.memberId !== state.lastSkip.toMemberId) {
            state.lastSkip = null;
          }
        }

        saveState();
        render();
        if (handoff) {
          toast(removed.name + ' 已移出，本周由 ' + handoff.name + ' 接替');
        } else {
          toast(removed.name + ' 已移出轮值名单');
        }
      }

      function handleCheckIn() {
        syncRotation(false);
        var member = currentMember();
        if (!member) {
          toast('请先添加室友');
          return;
        }
        if (todayDoneRecordFor(member.id)) {
          toast('今天已经打过卡啦');
          return;
        }

        state.history.push({
          id: makeId(),
          type: 'done',
          date: todayKey(),
          memberId: member.id,
          memberName: member.name,
          reason: '',
          handoffToId: '',
          handoffToName: '',
          checkedAt: new Date().toISOString()
        });
        state.history.sort(sortHistory);
        saveState();
        render();

        els.dutyCard.classList.add('celebrate');
        window.setTimeout(function () {
          els.dutyCard.classList.remove('celebrate');
        }, 650);
        toast('打卡成功，' + member.name + ' 今日值日完成');
      }

      function handleUndo() {
        var member = currentMember();
        if (!member) return;
        var today = todayKey();
        var index = state.history.findIndex(function (record) {
          return record.date === today && record.memberId === member.id && record.type !== 'skip';
        });
        if (index === -1) return;

        state.history.splice(index, 1);
        saveState();
        render();
        toast('已撤销今日打卡');
      }

      function openLeaveDialog() {
        if (syncRotation(false)) {
          saveState();
          render();
        }
        var member = currentMember();
        if (!member) {
          toast('请先添加室友');
          return;
        }
        if (state.members.length < 2) {
          toast('只有一位室友，无法顺延');
          return;
        }
        var next = nextMemberFor(member);
        if (!next) return;

        var message = '「' + member.name + '」本周的值日任务将顺延给「' + next.name + '」，提交后立即生效。';

        if (!els.leaveDialog || typeof els.leaveDialog.showModal !== 'function') {
          var answer = window.prompt('跳过/请假\n\n' + message + '\n\n请填写请假原因：', '');
          if (answer !== null) performLeave(answer);
          return;
        }

        els.leaveText.textContent = message;
        els.leaveReason.value = '';
        clearLeaveError();
        leaveReturnFocus = document.activeElement;
        els.leaveDialog.returnValue = '';
        if (els.leaveDialog.open) els.leaveDialog.close('cancel');
        els.leaveDialog.showModal();
        window.setTimeout(function () {
          els.leaveReason.focus({ preventScroll: true });
        }, 30);
      }

      function handleLeaveSubmit(event) {
        event.preventDefault();
        var reason = truncateReason(normalizeReason(els.leaveReason.value));
        if (!reason) {
          showLeaveError('请填写请假原因');
          return;
        }
        if (performLeave(reason)) {
          els.leaveDialog.close('confirm');
        }
      }

      function performLeave(rawReason) {
        syncRotation(false);
        var member = currentMember();
        var reason = truncateReason(normalizeReason(rawReason));
        if (!member) {
          toast('请先添加室友');
          return false;
        }
        if (state.members.length < 2) {
          toast('只有一位室友，无法顺延');
          return false;
        }
        if (!reason) {
          toast('请填写请假原因');
          return false;
        }

        var next = nextMemberFor(member);
        if (!next) return false;
        var now = new Date();
        var weekStart = currentWeekStart();
        var record = {
          id: makeId(),
          type: 'skip',
          date: todayKey(),
          memberId: member.id,
          memberName: member.name,
          reason: reason,
          handoffToId: next.id,
          handoffToName: next.name,
          checkedAt: now.toISOString()
        };

        state.history.push(record);
        state.history.sort(sortHistory);
        state.duty = { weekStart: weekStart, memberId: next.id };
        state.lastSkip = {
          recordId: record.id,
          fromMemberId: member.id,
          toMemberId: next.id,
          weekStart: weekStart,
          createdAt: now.toISOString()
        };

        saveState();
        render();
        toast('已请假，本周由 ' + next.name + ' 接替');
        return true;
      }

      function showLeaveError(message) {
        els.leaveError.textContent = message;
        els.leaveError.hidden = false;
        els.leaveReason.setAttribute('aria-invalid', 'true');
        els.leaveReason.focus({ preventScroll: true });
      }

      function clearLeaveError() {
        if (els.leaveError.hidden) return;
        els.leaveError.textContent = '';
        els.leaveError.hidden = true;
        els.leaveReason.removeAttribute('aria-invalid');
      }

      function undoLastSkip() {
        var active = getActiveSkip();
        if (!active) {
          toast('这次请假已无法撤销');
          return false;
        }

        state.history = state.history.filter(function (record) {
          return record.id !== active.record.id;
        });
        state.duty = { weekStart: currentWeekStart(), memberId: active.from.id };
        state.lastSkip = null;
        saveState();
        render();
        toast('已撤销请假，恢复 ' + active.from.name + ' 为本周值日生');
        return true;
      }

      function requestDeleteHistory(id) {
        var record = state.history.find(function (item) {
          return item.id === id;
        });
        if (!record) return;

        var active = getActiveSkip();
        var isActiveSkip = Boolean(active && active.record.id === id);
        var title = isActiveSkip ? '撤销这次请假？' : '删除这条记录？';
        var message;
        if (isActiveSkip) {
          message = '将撤销「' + record.memberName + '」的请假，恢复 TA 为本周值日生，并移除这条请假记录。';
        } else if (record.type === 'skip') {
          message = '将删除「' + record.memberName + '」在 ' + formatMonthDay(record.date) + ' 的请假记录，请假次数会同步更新。当前值日安排不会改变。';
        } else {
          message = '将删除「' + record.memberName + '」在 ' + formatMonthDay(record.date) + ' 的打卡记录，正常值日次数会同步更新。';
        }

        openConfirm(title, message, isActiveSkip ? '撤销' : '删除', function () {
          if (isActiveSkip) {
            undoLastSkip();
            return;
          }
          state.history = state.history.filter(function (item) {
            return item.id !== id;
          });
          saveState();
          render();
          toast('记录已删除');
        });
      }

      function requestClearHistory() {
        if (!state.history.length) return;
        openConfirm(
          '清空值日记录？',
          '将删除全部 ' + state.history.length + ' 条打卡和请假记录，此操作无法撤销。',
          '清空',
          function () {
            state.history = [];
            state.lastSkip = null;
            saveState();
            render();
            toast('值日记录已清空');
          }
        );
      }

      function requestResetAll() {
        openConfirm(
          '重置所有数据？',
          '将清空 ' + state.members.length + ' 位室友、' + state.history.length + ' 条值日记录以及当前轮值状态，恢复到初始界面。此操作无法撤销。',
          '重置',
          resetAllData
        );
      }

      function resetAllData() {
        var theme = state.settings.theme;
        state = createEmptyState();
        state.settings.theme = theme;
        els.nameInput.value = '';
        clearNameError();
        if (els.leaveDialog && els.leaveDialog.open) els.leaveDialog.close('cancel');
        saveState();
        render();
        toast('已重置所有数据');
      }

      function openConfirm(title, message, confirmLabel, onConfirm) {
        if (!els.dialog || typeof els.dialog.showModal !== 'function') {
          if (window.confirm(title + '\n\n' + message)) onConfirm();
          return;
        }

        if (els.dialog.open) els.dialog.close('cancel');
        els.dialogTitle.textContent = title;
        els.dialogText.textContent = message;
        els.dialogConfirm.textContent = confirmLabel;
        pendingConfirm = onConfirm;
        dialogReturnFocus = document.activeElement;
        els.dialog.returnValue = '';
        els.dialog.showModal();
      }

      function cycleTheme() {
        var index = THEME_ORDER.indexOf(state.settings.theme);
        state.settings.theme = THEME_ORDER[(index + 1) % THEME_ORDER.length];
        applyTheme();
        saveState();
      }

      function applyTheme() {
        var theme = state.settings.theme;
        if (theme === 'auto') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }

        var labels = { auto: '自动', dark: '深色', light: '浅色' };
        var names = { auto: '跟随系统', dark: '深色', light: '浅色' };
        els.themeLabel.textContent = labels[theme];
        els.themeIcon.innerHTML = ICONS[theme];
        els.themeToggle.setAttribute('aria-label', '当前主题：' + names[theme] + '。点击切换主题');
        els.themeToggle.title = '当前主题：' + names[theme] + '（点击切换）';

        var effective = theme === 'auto' ? (darkQuery.matches ? 'dark' : 'light') : theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', effective === 'dark' ? '#0b1015' : '#f3f0e9');
      }

      function checkDayChange() {
        var now = todayKey();
        if (now === lastDay) return;
        var changed = syncRotation(true);
        lastDay = now;
        if (changed) saveState();
        render();
      }

      function toast(message) {
        window.clearTimeout(toastTimer);
        els.toast.textContent = message;
        els.toast.classList.add('show');
        toastTimer = window.setTimeout(function () {
          els.toast.classList.remove('show');
        }, 3000);
      }
    }());
  </script>
</body>
</html>
