<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f0e9">
  <meta name="description" content="宿舍换水小工具：添加室友、自动轮换、每次打卡并保存在本机。">
  <title>宿舍换水</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f08a4b'/%3E%3Cpath d='M19 33.5l11.5 11.5M41 19L28.5 31.5M27.5 30.5c-2.3-2.3-6-2.3-8.3 0l-2.7 2.7 8.3 8.3 2.7-2.7c2.3-2.3 2.3-6 0-8.3Z' fill='none' stroke='%232b1608' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('dorm-duty:v1');
        var saved = raw ? JSON.parse(raw) : null;
        var theme = saved && saved.settings && saved.settings.theme;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0b1015' : '#f3f0e9');
      } catch (error) {}
    }());
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f0e9;
      --glow-a: rgba(255, 167, 101, 0.24);
      --glow-b: rgba(111, 174, 224, 0.13);
      --surface: rgba(255, 253, 248, 0.78);
      --surface-solid: #fffdf8;
      --row: rgba(255, 255, 255, 0.52);
      --inset: rgba(45, 40, 32, 0.045);
      --input-bg: rgba(255, 255, 255, 0.86);
      --border: rgba(39, 37, 33, 0.10);
      --border-strong: rgba(39, 37, 33, 0.16);
      --text: #1e2430;
      --text-soft: #4f5967;
      --text-muted: #626a77;
      --accent: #f08a4b;
      --accent-strong: #9c4516;
      --accent-grad-a: #f4a065;
      --accent-grad-b: #e77736;
      --accent-soft: rgba(240, 138, 75, 0.14);
      --accent-border: rgba(201, 101, 39, 0.24);
      --accent-contrast: #2b1608;
      --success: #157347;
      --success-soft: rgba(21, 115, 71, 0.11);
      --success-border: rgba(21, 115, 71, 0.22);
      --danger: #b83232;
      --danger-soft: rgba(184, 50, 50, 0.09);
      --danger-border: rgba(184, 50, 50, 0.22);
      --toast-bg: #20252c;
      --toast-text: #fff8ef;
      --shadow: 0 26px 60px -34px rgba(58, 44, 29, 0.38), 0 2px 6px rgba(58, 44, 29, 0.04);
      --shadow-soft: 0 18px 44px -34px rgba(58, 44, 29, 0.30);
      --focus: rgba(240, 138, 75, 0.30);
      --hero-a: rgba(255, 177, 108, 0.26);
      --hero-b: rgba(255, 255, 255, 0.14);
      --scrollbar: rgba(79, 89, 103, 0.28);
      --overlay: rgba(15, 20, 26, 0.46);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --bg: #0b1015;
        --glow-a: rgba(255, 143, 73, 0.13);
        --glow-b: rgba(63, 143, 196, 0.10);
        --surface: rgba(21, 29, 38, 0.76);
        --surface-solid: #141c24;
        --row: rgba(255, 255, 255, 0.035);
        --inset: rgba(255, 255, 255, 0.045);
        --input-bg: rgba(7, 12, 17, 0.48);
        --border: rgba(255, 255, 255, 0.075);
        --border-strong: rgba(255, 255, 255, 0.13);
        --text: #edf2f6;
        --text-soft: #b1bcc9;
        --text-muted: #8d99a9;
        --accent: #ff9b5c;
        --accent-strong: #ffc092;
        --accent-grad-a: #ffb176;
        --accent-grad-b: #ff9b5c;
        --accent-soft: rgba(255, 155, 92, 0.13);
        --accent-border: rgba(255, 155, 92, 0.23);
        --accent-contrast: #2b1608;
        --success: #5cdb95;
        --success-soft: rgba(92, 219, 149, 0.10);
        --success-border: rgba(92, 219, 149, 0.22);
        --danger: #ff8585;
        --danger-soft: rgba(255, 133, 133, 0.10);
        --danger-border: rgba(255, 133, 133, 0.22);
        --toast-bg: #eef3f8;
        --toast-text: #111820;
        --shadow: 0 30px 70px -36px rgba(0, 0, 0, 0.75), 0 2px 8px rgba(0, 0, 0, 0.18);
        --shadow-soft: 0 18px 46px -32px rgba(0, 0, 0, 0.7);
        --focus: rgba(255, 155, 92, 0.34);
        --hero-a: rgba(255, 143, 73, 0.16);
        --hero-b: rgba(255, 255, 255, 0.035);
        --scrollbar: rgba(177, 188, 201, 0.25);
        --overlay: rgba(0, 0, 0, 0.58);
      }
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1015;
      --glow-a: rgba(255, 143, 73, 0.13);
      --glow-b: rgba(63, 143, 196, 0.10);
      --surface: rgba(21, 29, 38, 0.76);
      --surface-solid: #141c24;
      --row: rgba(255, 255, 255, 0.035);
      --inset: rgba(255, 255, 255, 0.045);
      --input-bg: rgba(7, 12, 17, 0.48);
      --border: rgba(255, 255, 255, 0.075);
      --border-strong: rgba(255, 255, 255, 0.13);
      --text: #edf2f6;
      --text-soft: #b1bcc9;
      --text-muted: #8d99a9;
      --accent: #ff9b5c;
      --accent-strong: #ffc092;
      --accent-grad-a: #ffb176;
      --accent-grad-b: #ff9b5c;
      --accent-soft: rgba(255, 155, 92, 0.13);
      --accent-border: rgba(255, 155, 92, 0.23);
      --accent-contrast: #2b1608;
      --success: #5cdb95;
      --success-soft: rgba(92, 219, 149, 0.10);
      --success-border: rgba(92, 219, 149, 0.22);
      --danger: #ff8585;
      --danger-soft: rgba(255, 133, 133, 0.10);
      --danger-border: rgba(255, 133, 133, 0.22);
      --toast-bg: #eef3f8;
      --toast-text: #111820;
      --shadow: 0 30px 70px -36px rgba(0, 0, 0, 0.75), 0 2px 8px rgba(0, 0, 0, 0.18);
      --shadow-soft: 0 18px 46px -32px rgba(0, 0, 0, 0.7);
      --focus: rgba(255, 155, 92, 0.34);
      --hero-a: rgba(255, 143, 73, 0.16);
      --hero-b: rgba(255, 255, 255, 0.035);
      --scrollbar: rgba(177, 188, 201, 0.25);
      --overlay: rgba(0, 0, 0, 0.58);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }
    
    <body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.4c3.3 3.8 5.8 6.8 5.8 10.1a5.8 5.8 0 0 1-11.6 0c0-3.3 2.5-6.3 5.8-10.1Z"></path>
            <path d="M9.4 13.7c0 1.8 1.2 3 3 3"></path>
          </svg>
        </div>
        <div class="brand-copy">
          <p class="eyebrow">WATER DUTY</p>
          <h1>宿舍换水</h1>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题">
        <span id="themeIcon" aria-hidden="true"></span>
        <span id="themeLabel">自动</span>
      </button>
    </header>
    <main>
      <section class="hero" id="waterCard" aria-label="当前换水">
        <div class="hero-top">
          <p class="kicker"><span class="live-dot" aria-hidden="true"></span>当前换水</p>
          <span class="date-chip" id="todayDate"></span>
        </div>
        <div class="hero-empty" id="heroEmpty" hidden>
          <svg class="empty-art" viewBox="0 0 120 120" fill="none" aria-hidden="true">
            <circle cx="60" cy="58" r="47" fill="var(--accent-soft)"></circle>
            <path d="M49 30h22v8l7 10v33a7 7 0 0 1-7 7H49a7 7 0 0 1-7-7V48l7-10v-8Z" fill="var(--surface-solid)" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"></path>
            <path d="M47 27h26" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"></path>
            <path d="M45 66h30v14a5 5 0 0 1-5 5H50a5 5 0 0 1-5-5V66Z" fill="var(--accent-soft)"></path>
            <path d="M43 66c4.5 3 9.5 3 14 0s9.5-3 14 0" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"></path>
            <path d="M59 51c2.4 2.9 4.3 4.9 4.3 7a4.3 4.3 0 1 1-8.6 0c0-2.1 1.9-4.1 4.3-7Z" fill="var(--accent)" opacity=".7"></path>
            <path d="M31 35l1.8 4.2L37 41l-4.2 1.8L31 47l-1.8-4.2L25 41l4.2-1.8L31 35Z" fill="var(--accent)" opacity=".82"></path>
            <path d="M87 75l1.2 2.8 2.8 1.2-2.8 1.2L87 83l-1.2-2.8-2.8-1.2 2.8-1.2L87 75Z" fill="var(--accent)" opacity=".5"></path>
            <path d="M84 45.5c3-3.2 7.7-3.4 10.7-.5M32.5 85c-1.6 2.7-4.8 3.6-7.5 2.1" stroke="var(--text-muted)" stroke-width="2.4" stroke-linecap="round" opacity=".55"></path>
          </svg>
          <h2>先添加第一位室友</h2>
          <p>名单添加后，从第一位室友开始按次轮换。完成或跳过，都会自动顺延给下一位。</p>
          <button class="btn btn-primary" type="button" data-focus-add>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            添加室友
          </button>
        </div>
        <div id="heroActive" hidden>
          <div class="duty-main">
            <div class="avatar" id="currentAvatar" aria-hidden="true"></div>
            <div class="duty-copy">
              <h2 class="duty-name" id="currentName"></h2>
              <div class="status-line">
                <span class="status-pill pending" id="statusPill">该换水啦</span>
                <span class="duty-note" id="dutyNote">完成或跳过都会顺延</span>
              </div>
            </div>
          </div>
          <div class="duty-meta">
            <div class="meta-cell water-cell">
              <span class="meta-label">这桶水已经喝了</span>
              <strong class="meta-value water-value" id="waterDays">—</strong>
              <span class="meta-sub" id="waterLast">暂无换水记录</span>
            </div>
            <div class="meta-cell">
              <span class="meta-label">下一位</span>
              <strong class="meta-value" id="nextMemberValue">—</strong>
              <span class="meta-sub" id="nextMemberSub">完成或跳过后接棒</span>
            </div>
          </div>
          <div class="action-notice" id="actionNotice" hidden>
            <span class="action-notice-icon" id="actionNoticeIcon" aria-hidden="true"></span>
            <span class="action-notice-copy">
              <strong id="actionNoticeTitle"></strong>
              <span id="actionNoticeText"></span>
            </span>
            <button class="notice-undo" id="undoActionBtn" type="button">撤销</button>
          </div>
          <div class="action-row">
            <button class="btn btn-primary" id="completeBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m5 12.5 4.2 4.2L19 7"></path>
              </svg>
              完成换水
            </button>
            <button class="btn btn-secondary" id="skipBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h13"></path>
                <path d="m13 7 5 5-5 5"></path>
              </svg>
              跳过/不在
            </button>
          </div>
        </div>
      </section>
      <section class="card" aria-labelledby="membersTitle">
        <div class="section-head">
          <div>
            <h2 id="membersTitle">换水顺序</h2>
            <p>完成或跳过后，自动顺延给下一位</p>
          </div>
          <span class="count-badge" id="memberCount">0 人</span>
        </div>
        <ul class="member-list" id="memberList"></ul>
        <p class="mini-empty" id="memberEmpty" hidden>还没有室友，先添加一个吧。</p>
        <form class="add-form" id="addForm" novalidate>
          <label class="sr-only" for="nameInput">室友名字</label>
          <input
            class="add-input"
            id="nameInput"
            type="text"
            placeholder="输入室友名字"
            maxlength="16"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="done"
            aria-describedby="nameError"
          >
          <button class="btn btn-add" type="submit" aria-label="添加室友">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            <span>添加</span>
          </button>
        </form>
        <p class="form-error" id="nameError" role="alert" hidden></p>
      </section>
      <section class="card" aria-labelledby="historyTitle">
        <div class="section-head">
          <div>
            <h2 id="historyTitle">换水记录</h2>
            <p id="historyHint">完成或跳过第一次换水后，记录会出现在这里</p>
          </div>
          <button class="clear-btn" id="clearHistoryBtn" type="button" hidden>清空记录</button>
        </div>
        <ul class="history-list" id="historyList"></ul>
      </section>
      <p class="storage-note" id="storageNote">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2.5"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
        <span id="storageText">已开启本地保存 · 刷新不丢失</span>
      </p>
      <div class="reset-wrap">
        <button class="reset-btn" id="resetDataBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h16M9.5 7V5.4c0-.8.6-1.4 1.4-1.4h2.2c.8 0 1.4.6 1.4 1.4V7M6.4 7l.8 12c.1 1 .9 1.7 1.9 1.7h5.8c1 0 1.8-.7 1.9-1.7l.8-12"></path>
            <path d="M10 11v5.5M14 11v5.5"></path>
          </svg>
          重置所有数据
        </button>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog class="confirm-dialog" id="confirmDialog" aria-labelledby="dialogTitle" aria-describedby="dialogText">
    <form method="dialog">
      <div class="dialog-body">
        <div class="dialog-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 9v4"></path>
            <path d="M12 17h.01"></path>
            <path d="M10.3 4.2 2.8 17.5A2 2 0 0 0 4.5 20h15a2 2 0 0 0 1.7-2.5L13.7 4.2a2 2 0 0 0-3.4 0Z"></path>
          </svg>
        </div>
        <h2 class="dialog-title" id="dialogTitle">确认操作？</h2>
        <p class="dialog-text" id="dialogText"></p>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-cancel" type="submit" value="cancel">取消</button>
        <button class="btn btn-danger" id="dialogConfirm" type="submit" value="confirm">确认</button>
      </div>
    </form>
  </dialog>
  <dialog class="confirm-dialog leave-dialog" id="skipDialog" aria-labelledby="skipTitle" aria-describedby="skipText skipError">
    <form id="skipForm">
      <div class="dialog-body">
        <div class="dialog-icon leave-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h13"></path>
            <path d="m13 7 5 5-5 5"></path>
          </svg>
        </div>
        <h2 class="dialog-title" id="skipTitle">跳过 / 不在</h2>
        <p class="dialog-text" id="skipText"></p>
        <label class="leave-label" for="skipReason">跳过原因</label>
        <input
          class="leave-input"
          id="skipReason"
          type="text"
          maxlength="40"
          placeholder="例如：不在宿舍、临时外出"
          autocomplete="off"
          enterkeyhint="done"
          aria-describedby="skipText skipError"
        >
        <p class="form-error leave-error" id="skipError" role="alert" hidden></p>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-cancel" id="skipCancel" type="button">取消</button>
        <button class="btn btn-leave" type="submit">确认跳过</button>
      </div>
    </form>
  </dialog>
  <script>
    (function () {
      'use strict';
      var STORAGE_KEY = 'dorm-water:v1';
      var MAX_NAME_LENGTH = 16;
      var MAX_REASON_LENGTH = 40;
      var THEME_ORDER = ['auto', 'dark', 'light'];

        storageText: document.getElementById('storageText'),
        themeToggle: document.getElementById('themeToggle'),

        });
        if (duplicated) {
          showNameError('名单中已有「' + name + '」');
          return;
        }
        var member = {
          id: makeId(),
          name: name,
          createdAt: new Date().toISOString()
        };
        state.members.push(member);
        if (!state.currentMemberId) state.currentMemberId = member.id;
        clearNameError();
        els.nameInput.value = '';
        saveState();
        render();
        toast(state.members.length === 1
          ? '已添加 ' + member.name + '，从 TA 开始换水'
          : member.name + ' 已加入换水名单');
        els.nameInput.focus({ preventScroll: true });
      }
      function showNameError(message) {
        els.nameError.textContent = message;
        els.nameError.hidden = false;
        els.nameInput.setAttribute('aria-invalid', 'true');
        els.nameInput.focus({ preventScroll: true });
      }
      function clearNameError() {
        if (els.nameError.hidden) return;
        els.nameError.textContent = '';
        els.nameError.hidden = true;
        els.nameInput.removeAttribute('aria-invalid');
      }
      function requestDeleteMember(id) {
        var member = state.members.find(function (item) {
          return item.id === id;
        });
        if (!member) return;
        var isCurrent = state.currentMemberId === id;
        var message;
        if (isCurrent && state.members.length === 1) {
          message = '「' + member.name + '」是当前换水人。移出后名单将为空，当前换水人也会清空，历史记录会保留。';
        } else if (isCurrent) {
          message = '「' + member.name + '」是当前换水人。移出后，会自动由下一位室友接替，历史记录会保留。';
        } else {
          message = '确定将「' + member.name + '」从名单中移除吗？历史记录会保留。';
        }
        openConfirm('移出换水名单？', message, '移出', function () {
          deleteMember(id);
        });
      }
      function deleteMember(id) {
        ensureCurrent();
        var index = state.members.findIndex(function (member) {
          return member.id === id;
        });
        if (index === -1) return;
        var removed = state.members[index];
        var wasCurrent = state.currentMemberId === id;
        state.members.splice(index, 1);
        var handoff = null;
        if (!state.members.length) {
          state.currentMemberId = null;
        } else if (wasCurrent) {
          var nextIndex = index % state.members.length;
          handoff = state.members[nextIndex];
          state.currentMemberId = handoff.id;
        } else if (!state.members.some(function (member) { return member.id === state.currentMemberId; })) {
          state.currentMemberId = state.members[0].id;
        }
        cleanupLastAction();
        saveState();
        render();
        if (handoff) {
          toast(removed.name + ' 已移出，当前由 ' + handoff.name + ' 接替');
        } else {
          toast(removed.name + ' 已移出换水名单');
        }
      }
      function handleComplete() {
        if (Date.now() < actionLockUntil) {
          toast('操作太快，请稍候');
          return;
        }
        ensureCurrent();
        var member = currentMember();
        if (!member) {
          toast('请先添加室友');
          return;
        }
        var next = nextMemberFor(member);
        if (!next) return;
        var now = new Date();
        var today = todayKey();
        var previousWaterDate = state.lastWaterDate;
        var record = {
          id: makeId(),
          type: 'done',
          date: today,
          memberId: member.id,
          memberName: member.name,
          reason: '',
          checkedAt: now.toISOString()
        };
        state.history.push(record);
        state.history.sort(sortHistory);
        state.lastWaterDate = today;
        state.currentMemberId = next.id;
        state.lastAction = {
          recordId: record.id,
          type: 'done',
          fromMemberId: member.id,
          toMemberId: next.id,
          previousWaterDate: previousWaterDate,
          createdAt: now.toISOString()
        };
        actionLockUntil = Date.now() + 900;
        saveState();
        render();
        els.waterCard.classList.add('celebrate');
        window.setTimeout(function () {
          els.waterCard.classList.remove('celebrate');
        }, 650);
        toast(member.id === next.id
          ? '换水完成，继续由 ' + member.name + ' 负责'
          : '换水完成，已顺延给 ' + next.name);
      }
      function openSkipDialog() {
        ensureCurrent();
        var member = currentMember();
        if (!member) {
          toast('请先添加室友');
          return;
        }
        if (state.members.length < 2) {
          toast('只有一位室友，无法跳过');
          return;
        }
        var next = nextMemberFor(member);
        if (!next || next.id === member.id) return;
        var message = '「' + member.name + '」本次换水将顺延给「' + next.name + '」，提交后立即生效。';
        if (!els.skipDialog || typeof els.skipDialog.showModal !== 'function') {
          var answer = window.prompt('跳过 / 不在\n\n' + message + '\n\n请填写跳过原因：', '');
          if (answer !== null) performSkip(answer);
          return;
        }
        els.skipText.textContent = message;
        els.skipReason.value = '';
        clearSkipError();
        skipReturnFocus = document.activeElement;
        els.skipDialog.returnValue = '';
        if (els.skipDialog.open) els.skipDialog.close('cancel');
        els.skipDialog.showModal();
        window.setTimeout(function () {
          els.skipReason.focus({ preventScroll: true });
        }, 30);
      }
      function handleSkipSubmit(event) {
        event.preventDefault();
        var reason = truncateReason(normalizeReason(els.skipReason.value));
        if (!reason) {
          showSkipError('请填写跳过原因');
          return;
        }
        if (performSkip(reason)) {
          els.skipDialog.close('confirm');
        }
      }
      function performSkip(rawReason) {
        ensureCurrent();
        var member = currentMember();
        var reason = truncateReason(normalizeReason(rawReason));
        if (!member) {
          toast('请先添加室友');
          return false;
        }
        if (state.members.length < 2) {
          toast('只有一位室友，无法跳过');
          return false;
        }
        if (!reason) {
          toast('请填写跳过原因');
          return false;
        }
        var next = nextMemberFor(member);
        if (!next || next.id === member.id) return false;
        var now = new Date();
        var record = {
          id: makeId(),
          type: 'skip',
          date: todayKey(),
          memberId: member.id,
          memberName: member.name,
          reason: reason,
          checkedAt: now.toISOString()
        };
        state.history.push(record);
        state.history.sort(sortHistory);
        state.currentMemberId = next.id;
        state.lastAction = {
          recordId: record.id,
          type: 'skip',
          fromMemberId: member.id,
          toMemberId: next.id,
          previousWaterDate: state.lastWaterDate,
          createdAt: now.toISOString()
        };
        saveState();
        render();
        toast('已跳过，当前顺延给 ' + next.name);
        return true;
      }
      function showSkipError(message) {
        els.skipError.textContent = message;
        els.skipError.hidden = false;
        els.skipReason.setAttribute('aria-invalid', 'true');
        els.skipReason.focus({ preventScroll: true });
      }
      function clearSkipError() {
        if (els.skipError.hidden) return;
        els.skipError.textContent = '';
        els.skipError.hidden = true;
        els.skipReason.removeAttribute('aria-invalid');
      }
      function undoLastAction() {
        var active = getActiveAction();
        if (!active) {
          toast('这次操作已无法撤销');
          return false;
        }
        state.history = state.history.filter(function (record) {
          return record.id !== active.record.id;
        });
        state.currentMemberId = active.from.id;
        if (active.action.type === 'done') {
          state.lastWaterDate = normalizeDateKey(active.action.previousWaterDate) || null;
        }
        state.lastAction = null;
        saveState();
        render();
        toast(active.action.type === 'done'
          ? '已撤销换水，恢复 ' + active.from.name + ' 为当前换水人'
          : '已撤销跳过，恢复 ' + active.from.name + ' 为当前换水人');
        return true;
      }
      function requestDeleteHistory(id) {
        var record = state.history.find(function (item) {
          return item.id === id;
        });
        if (!record) return;
        var active = getActiveAction();
        var isActive = Boolean(active && active.record.id === id);
        var isSkip = record.type === 'skip';
        var title = isActive
          ? (isSkip ? '撤销这次跳过？' : '撤销这次换水？')
          : '删除这条记录？';
        var message;
        if (isActive) {
          message = isSkip
            ? '将撤销「' + record.memberName + '」的跳过记录，恢复 TA 为当前换水人，并重新允许接着完成换水。'
            : '将撤销「' + record.memberName + '」的换水记录，恢复 TA 为当前换水人，并把饮水天数恢复到这次换水之前。';
        } else if (isSkip) {
          message = '将删除「' + record.memberName + '」在 ' + formatMonthDay(record.date) + ' 的跳过记录，跳过次数会同步更新。当前换水人不会改变。';
        } else {
          message = '将删除「' + record.memberName + '」在 ' + formatMonthDay(record.date) + ' 的换水记录，正常换水次数会同步更新。当前换水人和饮水天数不会改变。';
        }
        openConfirm(title, message, isActive ? '撤销' : '删除', function () {
          if (isActive) {
            undoLastAction();
            return;
          }
          state.history = state.history.filter(function (item) {
            return item.id !== id;
          });
          saveState();
          render();
          toast('记录已删除');
        });
      }
      function requestClearHistory() {
        if (!state.history.length) return;
        openConfirm(
          '清空换水记录？',
          '将删除全部 ' + state.history.length + ' 条换水/跳过记录，并清空饮水天数计时。当前换水人不会改变，此操作无法撤销。',
          '清空',
          function () {
            state.history = [];
            state.lastAction = null;
            state.lastWaterDate = null;
            saveState();
            render();
            toast('换水记录已清空');
          }
        );
      }
      function requestResetAll() {
        openConfirm(
          '重置所有数据？',
          '将清空 ' + state.members.length + ' 位室友、' + state.history.length + ' 条换水记录、饮水天数和当前轮换状态，恢复到初始界面。此操作无法撤销。',
          '重置',
          resetAllData
        );
      }
      function resetAllData() {
        var theme = state.settings.theme;
        state = createEmptyState();
        state.settings.theme = theme;
        els.nameInput.value = '';
        clearNameError();
        if (els.skipDialog && els.skipDialog.open) els.skipDialog.close('cancel');
        actionLockUntil = 0;
        saveState();
        render();
        toast('已重置所有数据');
      }
      function openConfirm(title, message, confirmLabel, onConfirm) {
        if (!els.dialog || typeof els.dialog.showModal !== 'function') {
          if (window.confirm(title + '\n\n' + message)) onConfirm();
          return;
        }
        if (els.dialog.open) els.dialog.close('cancel');
        els.dialogTitle.textContent = title;
        els.dialogText.textContent = message;
        els.dialogConfirm.textContent = confirmLabel;
        pendingConfirm = onConfirm;
        dialogReturnFocus = document.activeElement;
        els.dialog.returnValue = '';
        els.dialog.showModal();
      }
      function cycleTheme() {
        var index = THEME_ORDER.indexOf(state.settings.theme);
        state.settings.theme = THEME_ORDER[(index + 1) % THEME_ORDER.length];
        applyTheme();
        saveState();
      }
      function applyTheme() {
        var theme = state.settings.theme;
        if (theme === 'auto') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
        var labels = { auto: '自动', dark: '深色', light: '浅色' };
        var names = { auto: '跟随系统', dark: '深色', light: '浅色' };
        els.themeLabel.textContent = labels[theme];
        els.themeIcon.innerHTML = ICONS[theme];
        els.themeToggle.setAttribute('aria-label', '当前主题：' + names[theme] + '。点击切换主题');
        els.themeToggle.title = '当前主题：' + names[theme] + '（点击切换）';
        var effective = theme === 'auto' ? (darkQuery.matches ? 'dark' : 'light') : theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', effective === 'dark' ? '#071019' : '#edf4f8');
      }
      function checkDayChange() {
        var now = todayKey();
        if (now === lastDay) return;
        lastDay = now;
        render();
      }
      function toast(message) {
        window.clearTimeout(toastTimer);
        els.toast.textContent = message;
        els.toast.classList.add('show');
        toastTimer = window.setTimeout(function () {
          els.toast.classList.remove('show');
        }, 3000);
      }
    }());
  </script>
</body>
</html>
